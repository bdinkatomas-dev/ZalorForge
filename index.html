<!DOCTYPE html>
<html lang="cs" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZalorForge — Home</title>
    <style>
        :root[data-theme="dark"] {
            --bg-color: #0d1117;
            --surface-color: #161b22;
            --surface-hover: #1f242c;
            --text-color: #f0f6fc;
            --text-secondary: #8b949e;
            --border-color: #30363d;
            --accent-color: #58a6ff;
            --accent-gradient: linear-gradient(135deg, #58a6ff, #bc8cff);
            --shadow: 0 16px 40px -12px rgba(0, 0, 0, 0.7);
            --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        :root[data-theme="light"] {
            --bg-color: #f8fafc;
            --surface-color: #ffffff;
            --surface-hover: #f1f5f9;
            --text-color: #0f172a;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --accent-color: #2563eb;
            --accent-gradient: linear-gradient(135deg, #2563eb, #4f46e5);
            --shadow: 0 12px 30px -8px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        header {
            display: flex;
            justify-content: space-between;
            padding: 24px 32px;
            align-items: center;
            width: 100%;
            max-width: 1100px;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .header-right {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .control-btn {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 14px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            transition: var(--transition);
        }

        .control-btn:hover {
            border-color: var(--accent-color);
            background: var(--surface-hover);
        }

        .control-btn.primary {
            background: var(--accent-gradient);
            color: #ffffff;
            border: none;
            box-shadow: 0 4px 15px rgba(88, 166, 255, 0.25);
        }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .user-badge span {
            color: var(--accent-color);
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            padding: 20px;
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        .hero-card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 48px 32px;
            width: 100%;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .hero-title {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 12px;
        }

        .hero-desc {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 32px;
        }

        .action-container {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .cta-btn {
            background: var(--accent-gradient);
            color: #ffffff;
            border: none;
            padding: 14px 28px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: var(--transition);
            box-shadow: 0 4px 20px rgba(88, 166, 255, 0.3);
        }

        .cta-btn:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        footer {
            padding: 24px 32px;
            color: var(--text-secondary);
            font-size: 12px;
            text-align: center;
        }

        @media (max-width: 600px) {
            header { padding: 16px 20px; }
            .hero-card { padding: 32px 20px; border-radius: 22px; }
            .hero-title { font-size: 26px; }
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">ZalorForge</a>
        <div class="header-right">
            <!-- Dynamický blok pro přihlášeného uživatele nebo přihlašovací tlačítko -->
            <div id="authHeaderArea">
                <a href="sign-in/" class="control-btn primary" id="navSignIn">Sign In</a>
            </div>
            <button class="control-btn" onclick="toggleLanguage()">
                <span id="langLabel">EN</span>
            </button>
        </div>
    </header>

    <main>
        <div class="hero-card">
            <h1 class="hero-title" id="heroTitle">Vítejte v ZalorForge</h1>
            <p class="hero-desc" id="heroDesc">Vysoce optimalizovaný ekosystém pro vaše moderní webové aplikace s podporou Turso DB a Cloudflare.</p>
            <div class="action-container" id="heroAction">
                <a href="sign-in/" class="cta-btn" id="ctaBtn">Začít ihned</a>
            </div>
        </div>
    </main>

    <footer>
        © ZalorForge Project • Cloudflare Functions & Turso DB
    </footer>

    <script>
        const i18n = {
            cs: {
                signIn: "Přihlásit se",
                signOut: "Odhlásit",
                welcomeUser: "Uživatel:",
                heroTitle: "Vítejte v ZalorForge",
                heroDesc: "Vysoce optimalizovaný ekosystém pro vaše moderní webové aplikace s podporou Turso DB a Cloudflare.",
                ctaBtn: "Otevřít profil",
                ctaDefault: "Začít ihned"
            },
            en: {
                signIn: "Sign In",
                signOut: "Sign Out",
                welcomeUser: "User:",
                heroTitle: "Welcome to ZalorForge",
                heroDesc: "Highly optimized ecosystem for your modern web applications powered by Turso DB and Cloudflare.",
                ctaBtn: "Open Profile",
                ctaDefault: "Get Started"
            }
        };

        let currentLang = localStorage.getItem('zalorforge_lang') || 'cs';

        function updateUI() {
            const t = i18n[currentLang];
            const savedName = localStorage.getItem('zalorforge_name');
            const savedEmail = localStorage.getItem('zalorforge_email');

            const authArea = document.getElementById('authHeaderArea');
            const heroTitle = document.getElementById('heroTitle');
            const heroDesc = document.getElementById('heroDesc');
            const ctaBtn = document.getElementById('ctaBtn');

            heroTitle.textContent = t.heroTitle;
            heroDesc.textContent = t.heroDesc;
            document.getElementById('langLabel').textContent = currentLang === 'cs' ? 'EN' : 'CS';

            if (savedEmail) {
                // Uživatel je přihlášený
                const displayName = savedName || savedEmail.split('@')[0];
                authArea.innerHTML = `
                    <div class="user-badge">
                        👤 <span>${displayName}</span>
                    </div>
                    <button class="control-btn" onclick="handleSignOut()">${t.signOut}</button>
                `;
                ctaBtn.textContent = t.ctaBtn;
            } else {
                // Uživatel přihlášený není
                authArea.innerHTML = `
                    <a href="sign-in/" class="control-btn primary" id="navSignIn">${t.signIn}</a>
                `;
                ctaBtn.textContent = t.ctaDefault;
            }
        }

        function toggleLanguage() {
            currentLang = currentLang === 'cs' ? 'en' : 'cs';
            localStorage.setItem('zalorforge_lang', currentLang);
            updateUI();
        }

        function handleSignOut() {
            // Vymazání údajů o přihlášení z localStorage
            localStorage.removeItem('zalorforge_name');
            localStorage.removeItem('zalorforge_email');
            updateUI();
        }

        document.addEventListener("DOMContentLoaded", updateUI);
    </script>
</body>
</html>
