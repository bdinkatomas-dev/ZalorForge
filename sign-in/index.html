<!DOCTYPE html>
<html lang="cs" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZalorForge — Sign In</title>
    <style>
        :root[data-theme="dark"] {
            --bg-color: #090d16;
            --surface-color: #111827;
            --surface-hover: #1f293d;
            --text-color: #f3f4f6;
            --text-secondary: #9ca3af;
            --border-color: #1f293d;
            --accent-color: #3b82f6;
            --accent-gradient: linear-gradient(135deg, #3b82f6, #8b5cf6);
            --shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
            --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        :root[data-theme="light"] {
            --bg-color: #f8fafc;
            --surface-color: #ffffff;
            --surface-hover: #f1f5f9;
            --text-color: #0f172a;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --accent-color: #2563eb;
            --accent-gradient: linear-gradient(135deg, #2563eb, #4f46e5);
            --shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        header {
            display: flex;
            justify-content: space-between;
            padding: 24px 32px;
            align-items: center;
            width: 100%;
            max-width: 1200px;
        }

        .back-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--accent-color);
        }

        .back-link svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.2;
        }

        .control-btn {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 14px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: var(--transition);
        }

        .control-btn:hover {
            border-color: var(--accent-color);
            background: var(--surface-hover);
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            padding: 20px;
            width: 100%;
            max-width: 440px;
        }

        .card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 36px 32px;
            width: 100%;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }

        .logo-title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .choice-screen {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .choice-btn {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 16px 20px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .choice-btn:hover {
            border-color: var(--accent-color);
            background-color: var(--surface-hover);
            transform: translateY(-2px);
        }

        .choice-btn.primary {
            background: var(--accent-gradient);
            color: #ffffff;
            border: none;
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.3);
        }

        .choice-btn.primary:hover {
            opacity: 0.95;
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4);
        }

        .form-screen {
            display: none;
            flex-direction: column;
            gap: 18px;
        }

        .form-screen.active {
            display: flex;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            padding-left: 4px;
        }

        .text-input {
            width: 100%;
            height: 50px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 0 16px;
            color: var(--text-color);
            font-size: 14px;
            outline: none;
            transition: var(--transition);
        }

        .text-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }

        .submit-btn {
            background: var(--accent-gradient);
            color: #ffffff;
            border: none;
            height: 50px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 6px;
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.3);
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            opacity: 0.95;
        }

        .back-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            margin-top: 8px;
            padding: 6px;
            transition: color 0.2s;
        }

        .back-btn:hover {
            color: var(--text-color);
        }

        .status-msg {
            font-size: 12px;
            text-align: center;
            min-height: 20px;
            margin-top: 4px;
            font-weight: 500;
        }

        .status-msg.error { color: #ef4444; }
        .status-msg.success { color: #22c55e; }

        footer {
            padding: 24px 32px;
            color: var(--text-secondary);
            font-size: 12px;
            text-align: center;
        }

        @media (max-width: 600px) {
            header { padding: 16px 20px; }
            .card { padding: 28px 22px; border-radius: 24px; }
        }
    </style>
</head>
<body>

    <header>
        <a href="../" class="back-link">
            <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            <span id="navBack">Zpět domů</span>
        </a>
        <div class="header-left">
            <button class="control-btn" onclick="toggleLanguage()">
                <span id="langLabel">EN</span>
            </button>
        </div>
    </header>

    <main>
        <div class="card">
            <h1 class="logo-title">ZalorForge</h1>
            <p class="subtitle" id="subTitle">Zvolte možnost pokračování</p>

            <div id="choiceScreen" class="choice-screen">
                <button class="choice-btn primary" onclick="showForm('register')">
                    <span id="btnRegChoice">Vytvořit nový účet</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                </button>
                <button class="choice-btn" onclick="showForm('login')">
                    <span id="btnLoginChoice">Mám již účet (Přihlásit)</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="9 18 15 12 9 6"/></svg>
                </button>
            </div>

            <form id="registerForm" class="form-screen" onsubmit="handleAuth(event, 'register')">
                <div class="input-group">
                    <label class="input-label" id="labelName">Jméno</label>
                    <input type="text" id="regName" class="text-input" required placeholder="Vaše jméno">
                </div>
                <div class="input-group">
                    <label class="input-label" id="labelEmailReg">Email</label>
                    <input type="email" id="regEmail" class="text-input" required placeholder="name@example.com">
                </div>
                <div class="input-group">
                    <label class="input-label" id="labelPassReg">Heslo</label>
                    <input type="password" id="regPassword" class="text-input" required placeholder="••••••••">
                </div>
                <button type="submit" class="submit-btn" id="btnSubmitReg">Zaregistrovat se</button>
                <button type="button" class="back-btn" onclick="resetToChoice()" id="btnBackReg">Zpět</button>
                <div id="regStatus" class="status-msg"></div>
            </form>

            <form id="loginForm" class="form-screen" onsubmit="handleAuth(event, 'login')">
                <div class="input-group">
                    <label class="input-label" id="labelEmailLog">Email</label>
                    <input type="email" id="logEmail" class="text-input" required placeholder="name@example.com">
                </div>
                <div class="input-group">
                    <label class="input-label" id="labelPassLog">Heslo</label>
                    <input type="password" id="logPassword" class="text-input" required placeholder="••••••••">
                </div>
                <button type="submit" class="submit-btn" id="btnSubmitLog">Přihlásit se</button>
                <button type="button" class="back-btn" onclick="resetToChoice()" id="btnBackLog">Zpět</button>
                <div id="logStatus" class="status-msg"></div>
            </form>
        </div>
    </main>

    <footer>
        © ZalorForge Project • Cloudflare & Turso DB
    </footer>

    <script>
        const i18n = {
            cs: {
                back: "Zpět domů",
                subChoice: "Zvolte možnost pokračování",
                regChoice: "Vytvořit nový účet",
                logChoice: "Mám již účet (Přihlásit)",
                subReg: "Založte si nový účet v ekosystému",
                subLog: "Přihlaste se ke svému účtu",
                name: "Jméno",
                email: "Email",
                pass: "Heslo",
                btnReg: "Zaregistrovat se",
                btnLog: "Přihlásit se",
                backBtn: "Zpět",
                processing: "Zpracovávám...",
                verifying: "Ověřuji...",
                successReg: "Účet úspěšně vytvořen! Přesměrovávám...",
                successLog: "Přihlášení úspěšné! Vítejte zpět.",
                errorDefault: "Došlo k chybě, zkuste to prosím znovu."
            },
            en: {
                back: "Back Home",
                subChoice: "Choose how you want to proceed",
                regChoice: "Create new account",
                logChoice: "I already have an account (Sign In)",
                subReg: "Create a new account in the ecosystem",
                subLog: "Sign in to your account",
                name: "Name",
                email: "Email",
                pass: "Password",
                btnReg: "Register",
                btnLog: "Sign In",
                backBtn: "Back",
                processing: "Processing...",
                verifying: "Verifying...",
                successReg: "Account created successfully! Redirecting...",
                successLog: "Login successful! Welcome back.",
                errorDefault: "An error occurred, please try again."
            }
        };

        let currentLang = localStorage.getItem('zalorforge_lang') || 'cs';

        function updateTexts() {
            const t = i18n[currentLang];
            document.getElementById('navBack').textContent = t.back;
            document.getElementById('subTitle').textContent = t.subChoice;
            document.getElementById('btnRegChoice').textContent = t.regChoice;
            document.getElementById('btnLoginChoice').textContent = t.logChoice;
            document.getElementById('labelName').textContent = t.name;
            document.getElementById('labelEmailReg').textContent = t.email;
            document.getElementById('labelPassReg').textContent = t.pass;
            document.getElementById('labelEmailLog').textContent = t.email;
            document.getElementById('labelPassLog').textContent = t.pass;
            document.getElementById('btnSubmitReg').textContent = t.btnReg;
            document.getElementById('btnSubmitLog').textContent = t.btnLog;
            document.getElementById('btnBackReg').textContent = t.backBtn;
            document.getElementById('btnBackLog').textContent = t.backBtn;
            document.getElementById('langLabel').textContent = currentLang === 'cs' ? 'EN' : 'CS';
        }

        function toggleLanguage() {
            currentLang = currentLang === 'cs' ? 'en' : 'cs';
            localStorage.setItem('zalorforge_lang', currentLang);
            updateTexts();
        }

        // Načtení uloženého e-mailu z LocalStorage při startu
        function loadSavedEmail() {
            const savedEmail = localStorage.getItem('zalorforge_saved_email');
            if (savedEmail) {
                document.getElementById('logEmail').value = savedEmail;
                document.getElementById('regEmail').value = savedEmail;
            }
        }

        function showForm(type) {
            const t = i18n[currentLang];
            document.getElementById('choiceScreen').style.display = 'none';
            document.getElementById('registerForm').classList.remove('active');
            document.getElementById('loginForm').classList.remove('active');

            if (type === 'register') {
                document.getElementById('registerForm').classList.add('active');
                document.getElementById('subTitle').textContent = t.subReg;
            } else {
                document.getElementById('loginForm').classList.add('active');
                document.getElementById('subTitle').textContent = t.subLog;
            }
        }

        function resetToChoice() {
            const t = i18n[currentLang];
            document.getElementById('choiceScreen').style.display = 'flex';
            document.getElementById('registerForm').classList.remove('active');
            document.getElementById('loginForm').classList.remove('active');
            document.getElementById('subTitle').textContent = t.subChoice;
            document.getElementById('regStatus').textContent = '';
            document.getElementById('logStatus').textContent = '';
        }

        async function handleAuth(event, action) {
            event.preventDefault();
            const t = i18n[currentLang];
            const isRegister = action === 'register';
            const statusEl = document.getElementById(isRegister ? 'regStatus' : 'logStatus');
            
            // Úprava e-mailu na malé písmeno a ořezání mezer (šetří místo a zajišťuje čistotu v DB)
            const cleanEmail = (isRegister ? document.getElementById('regEmail').value : document.getElementById('logEmail').value).trim().toLowerCase();

            const payload = {
                action: action,
                email: cleanEmail,
                password: document.getElementById(isRegister ? 'regPassword' : 'logPassword').value
            };

            if (isRegister) {
                payload.name = document.getElementById('regName').value.trim();
            }

            statusEl.textContent = isRegister ? t.processing : t.verifying;
            statusEl.className = "status-msg";

            try {
                const response = await fetch('/api/auth', {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                
                if (response.ok && result.success) {
                    // Uložení e-mailu do LocalStorage pro příští přihlášení
                    localStorage.setItem('zalorforge_saved_email', cleanEmail);

                    statusEl.textContent = isRegister ? t.successReg : t.successLog;
                    statusEl.className = "status-msg success";
                    setTimeout(() => window.location.href = "../", 1500);
                } else {
                    statusEl.textContent = result.error || t.errorDefault;
                    statusEl.className = "status-msg error";
                }
            } catch (err) {
                statusEl.textContent = t.errorDefault;
                statusEl.className = "status-msg error";
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            updateTexts();
            loadSavedEmail();
        });
    </script>
</body>
</html>
