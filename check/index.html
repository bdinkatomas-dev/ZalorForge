<!DOCTYPE html>
<html lang="cs" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zalorforge-check — Calendar & Tasks</title>
    <style>
        :root[data-theme="dark"] {
            --bg-color: #0f1117;
            --surface-color: #161b22;
            --surface-hover: #1f242c;
            --text-color: #f0f6fc;
            --text-secondary: #8b949e;
            --border-color: #30363d;
            --accent-color: #58a6ff;
            --event-color: #d29922;
            --success-color: #238636;
            --danger-color: #ff7b72;
        }

        :root[data-theme="light"] {
            --bg-color: #f6f8fa;
            --surface-color: #ffffff;
            --surface-hover: #f3f4f6;
            --text-color: #24292f;
            --text-secondary: #57606a;
            --border-color: #d0d7de;
            --accent-color: #0969da;
            --event-color: #9a6700;
            --success-color: #1a7f37;
            --danger-color: #cf222e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            transition: background-color 0.2s, color 0.2s;
        }

        .app-container {
            display: flex;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        /* Sidebar / Management Panel */
        .sidebar {
            width: 400px;
            background-color: var(--surface-color);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 24px;
            gap: 20px;
            z-index: 20;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.2s, border-color 0.2s;
        }

        .brand {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand h2 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .settings-bar {
            display: flex;
            gap: 8px;
        }

        .settings-btn {
            flex: 1;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px;
            font-size: 11px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .settings-btn:hover {
            border-color: var(--accent-color);
        }

        .type-selector {
            display: flex;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 3px;
        }

        .type-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 6px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .type-btn.active {
            background: var(--surface-hover);
            color: var(--text-color);
        }

        .form-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: 10px;
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        input, select {
            flex-grow: 1;
            padding: 10px 12px;
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        button.action-btn {
            background-color: var(--accent-color);
            color: var(--bg-color);
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        button.action-btn:hover {
            opacity: 0.9;
        }

        .items-list {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
        }

        .item-card {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            transition: border-color 0.2s;
        }

        .item-card:hover {
            border-color: var(--text-secondary);
        }

        .item-card.completed span {
            text-decoration: line-through;
            color: var(--text-secondary);
        }

        .item-actions {
            display: flex;
            gap: 6px;
        }

        .item-actions button {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 5px 10px;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
        }

        .item-actions button:hover {
            color: var(--danger-color);
            border-color: var(--danger-color);
        }

        /* Main Calendar View */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 24px;
            overflow-y: auto;
            background-color: var(--bg-color);
            transition: background-color 0.2s;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .calendar-header h1 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .calendar-nav {
            display: flex;
            gap: 6px;
        }

        .calendar-nav button {
            background-color: var(--surface-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
        }

        .calendar-nav button:hover {
            border-color: var(--accent-color);
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-auto-rows: minmax(110px, 1fr);
            gap: 8px;
            flex-grow: 1;
        }

        .day-cell {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow-y: auto;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .day-cell.today {
            border-color: var(--accent-color);
            background-color: var(--surface-hover);
        }

        .day-number {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .day-cell.today .day-number {
            color: var(--accent-color);
        }

        .calendar-tag {
            background-color: var(--bg-color);
            padding: 4px 8px;
            font-size: 11px;
            border-radius: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            border: 1px solid var(--border-color);
            transition: opacity 0.2s;
        }

        .calendar-tag.task {
            border-left: 3px solid var(--accent-color);
        }

        .calendar-tag.event {
            border-left: 3px solid var(--event-color);
        }

        .calendar-tag:hover {
            border-color: var(--text-secondary);
        }

        .calendar-tag.completed {
            opacity: 0.35;
            text-decoration: line-through;
            border-left-color: var(--text-secondary);
        }

        .mobile-only {
            display: none;
        }

        @media (max-width: 900px) {
            .sidebar {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                transform: translateX(-100%);
                border-right: none;
            }

            .sidebar.mobile-open {
                transform: translateX(0);
            }

            .mobile-only {
                display: inline-block;
            }

            .main-content {
                padding: 16px;
            }

            .calendar-header h1 {
                font-size: 18px;
            }

            .days-grid {
                grid-auto-rows: minmax(75px, 1fr);
                gap: 6px;
            }

            .weekdays {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="brand">
                <h2>Zalorforge-check</h2>
                <button class="mobile-only" onclick="toggleMobileSidebar()" style="background:transparent; color:var(--text-color); border:1px solid var(--border-color); padding:4px 10px; border-radius:6px; cursor:pointer;">✕</button>
            </div>
            
            <div class="settings-bar">
                <button class="settings-btn" id="langBtn" onclick="toggleLanguage()">CZ / EN</button>
                <button class="settings-btn" id="themeBtn" onclick="toggleTheme()">Dark / Light</button>
            </div>

            <div class="type-selector">
                <button class="type-btn active" id="typeTaskBtn" onclick="switchInputType('task')">Task</button>
                <button class="type-btn" id="typeEventBtn" onclick="switchInputType('event')">Event</button>
            </div>

            <div class="form-panel">
                <div class="input-group">
                    <input type="text" id="itemTitle" data-i18n-placeholder="titlePlaceholder" placeholder="Title (e.g. Tomášek narozeniny)...">
                </div>
                <div class="input-group" id="timeGroup" style="display: none;">
                    <input type="time" id="itemTime">
                </div>
                <div class="input-group">
                    <input type="date" id="itemDate">
                    <button class="action-btn" id="addBtnText" onclick="addItem()">Add</button>
                </div>
            </div>

            <div class="items-list" id="itemsList"></div>
        </div>

        <!-- Main Calendar View -->
        <div class="main-content">
            <div class="calendar-header">
                <h1 id="monthYearDisplay"></h1>
                <div class="header-controls">
                    <button class="mobile-only" onclick="toggleMobileSidebar()" style="background-color: var(--surface-color); color: var(--text-color); border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 6px; cursor: pointer;">Menu ☰</button>
                    <div class="calendar-nav">
                        <button onclick="changeMonth(-1)" id="prevBtnText">Prev</button>
                        <button onclick="currentMonthView()" id="todayBtnText">Today</button>
                        <button onclick="changeMonth(1)" id="nextBtnText">Next</button>
                    </div>
                </div>
            </div>

            <div class="weekdays" id="weekdaysGrid">
                <!-- Days will be populated via JS -->
            </div>

            <div class="days-grid" id="daysGrid"></div>
        </div>
    </div>

    <script>
        // Localization dictionaries
        const i18n = {
            cs: {
                task: "Úkol",
                event: "Událost",
                add: "Přidat",
                prev: "Předchozí",
                today: "Dnes",
                next: "Další",
                done: "Hotovo",
                undo: "Zpět",
                del: "Smazat",
                titlePlaceholder: "Název (např. Tomášek narozeniny)...",
                alertTitle: "Zadejte prosím název.",
                weekdays: ["Po", "Út", "St", "Čt", "Pá", "So", "Ne"],
                months: ["Leden", "Únor", "Březen", "Duben", "Květen", "Červen", "Červenec", "Srpen", "Září", "Říjen", "Listopad", "Prosinec"]
            },
            en: {
                task: "Task",
                event: "Event",
                add: "Add",
                prev: "Prev",
                today: "Today",
                next: "Next",
                done: "Done",
                undo: "Undo",
                del: "Del",
                titlePlaceholder: "Title (e.g. Tomášek birthday)...",
                alertTitle: "Please enter a title.",
                weekdays: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"],
                months: ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"]
            }
        };

        let currentLang = localStorage.getItem('zalorforge_lang') || 'cs';
        let currentTheme = localStorage.getItem('zalorforge_theme') || 'dark';
        
        let items = JSON.parse(localStorage.getItem('zalorforge_items')) || [];
        let activeType = 'task';
        let today = new Date();
        let currentMonth = today.getMonth();
        let currentYear = today.getFullYear();

        // Apply saved theme on load
        document.documentElement.setAttribute('data-theme', currentTheme);

        function saveSettings() {
            localStorage.setItem('zalorforge_lang', currentLang);
            localStorage.setItem('zalorforge_theme', currentTheme);
            localStorage.setItem('zalorforge_items', JSON.stringify(items));
        }

        function toggleTheme() {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', currentTheme);
            saveSettings();
        }

        function toggleLanguage() {
            currentLang = currentLang === 'cs' ? 'en' : 'cs';
            saveSettings();
            render();
        }

        function toggleMobileSidebar() {
            document.getElementById('sidebar').classList.toggle('mobile-open');
        }

        function switchInputType(type) {
            activeType = type;
            const taskBtn = document.getElementById('typeTaskBtn');
            const eventBtn = document.getElementById('typeEventBtn');
            const timeGroup = document.getElementById('timeGroup');

            const t = i18n[currentLang];
            taskBtn.textContent = t.task;
            eventBtn.textContent = t.event;

            if (type === 'task') {
                taskBtn.classList.add('active');
                eventBtn.classList.remove('active');
                timeGroup.style.display = 'none';
            } else {
                eventBtn.classList.add('active');
                taskBtn.classList.remove('active');
                timeGroup.style.display = 'flex';
            }
        }

        function addItem() {
            const titleInput = document.getElementById('itemTitle');
            const dateInput = document.getElementById('itemDate');
            const timeInput = document.getElementById('itemTime');
            const t = i18n[currentLang];
            
            if (!titleInput.value.trim()) return alert(t.alertTitle);

            const newItem = {
                id: Date.now(),
                type: activeType,
                title: titleInput.value.trim(),
                date: dateInput.value || new Date().toISOString().split('T')[0],
                time: activeType === 'event' ? (timeInput.value || '') : '',
                completed: false
            };

            items.push(newItem);
            saveSettings();
            
            titleInput.value = '';
            timeInput.value = '';
            dateInput.value = '';
            render();
        }

        function toggleComplete(id) {
            items = items.map(item => item.id === id ? { ...item, completed: !item.completed } : item);
            saveSettings();
            render();
        }

        function deleteItem(id) {
            items = items.filter(item => item.id !== id);
            saveSettings();
            render();
        }

        function changeMonth(direction) {
            currentMonth += direction;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            } else if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderCalendar();
        }

        function currentMonthView() {
            currentMonth = today.getMonth();
            currentYear = today.getFullYear();
            renderCalendar();
        }

        function render() {
            const t = i18n[currentLang];

            // Update static texts
            document.getElementById('typeTaskBtn').textContent = t.task;
            document.getElementById('typeEventBtn').textContent = t.event;
            document.getElementById('addBtnText').textContent = t.add;
            document.getElementById('prevBtnText').textContent = t.prev;
            document.getElementById('todayBtnText').textContent = t.today;
            document.getElementById('nextBtnText').textContent = t.next;
            document.getElementById('itemTitle').placeholder = t.titlePlaceholder;
            
            // Render weekdays header
            const weekdaysGrid = document.getElementById('weekdaysGrid');
            weekdaysGrid.innerHTML = t.weekdays.map(d => `<div>${d}</div>`).join('');

            renderList();
            renderCalendar();
        }

        function renderList() {
            const listContainer = document.getElementById('itemsList');
            listContainer.innerHTML = '';
            const t = i18n[currentLang];

            const sortedItems = [...items].sort((a, b) => new Date(a.date) - new Date(b.date));

            sortedItems.forEach(item => {
                const div = document.createElement('div');
                div.className = `item-card ${item.completed ? 'completed' : ''}`;
                
                const badgeText = item.type === 'event' ? (item.time ? `${item.date} • ${item.time}` : item.date) : item.date;

                div.innerHTML = `
                    <div style="overflow: hidden; padding-right: 8px;">
                        <span style="display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500;">
                            ${item.type === 'event' ? '📅 ' : '✔️ '}${item.title}
                        </span>
                        <div style="font-size: 11px; color: var(--text-secondary); margin-top: 2px;">${badgeText}</div>
                    </div>
                    <div class="item-actions" style="flex-shrink: 0;">
                        ${item.type === 'task' ? `<button onclick="toggleComplete(${item.id})">${item.completed ? t.undo : t.done}</button>` : ''}
                        <button onclick="deleteItem(${item.id})">${t.del}</button>
                    </div>
                `;
                listContainer.appendChild(div);
            });
        }

        function renderCalendar() {
            const display = document.getElementById('monthYearDisplay');
            const grid = document.getElementById('daysGrid');
            const t = i18n[currentLang];
            
            display.textContent = `${t.months[currentMonth]} ${currentYear}`;
            grid.innerHTML = '';

            let firstDayIndex = (new Date(currentYear, currentMonth, 1).getDay() + 6) % 7;
            let totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell';
                cell.style.opacity = '0.15';
                grid.appendChild(cell);
            }

            for (let day = 1; day <= totalDays; day++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell';
                
                const formattedMonth = String(currentMonth + 1).padStart(2, '0');
                const formattedDay = String(day).padStart(2, '0');
                const dateString = `${currentYear}-${formattedMonth}-${formattedDay}`;

                if (day === today.getDate() && currentMonth === today.getMonth() && currentYear === today.getFullYear()) {
                    cell.classList.add('today');
                }

                cell.innerHTML = `<div class="day-number">${day}</div>`;

                const dayItems = items.filter(i => i.date === dateString);
                dayItems.forEach(item => {
                    const tag = document.createElement('div');
                    tag.className = `calendar-tag ${item.type} ${item.completed ? 'completed' : ''}`;
                    
                    const labelPrefix = item.type === 'event' && item.time ? `${item.time} ` : '';
                    tag.textContent = labelPrefix + item.title;
                    
                    tag.onclick = (e) => {
                        e.stopPropagation();
                        if (item.type === 'task') toggleComplete(item.id);
                    };
                    cell.appendChild(tag);
                });

                grid.appendChild(cell);
            }
        }

        render();
    </script>
</body>
</html>
