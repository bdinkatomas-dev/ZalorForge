<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZalorForge</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --text-color: #e8eaed;
            --text-secondary: #9aa0a6;
            --border-color: #3c4043;
            --hover-bg: #2d2f31;
            --shadow-color: rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
        }

        header {
            display: flex;
            justify-content: flex-end;
            padding: 16px 24px;
            gap: 16px;
            align-items: center;
        }

        header a {
            color: var(--text-color);
            text-decoration: none;
            font-size: 13px;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        header a:hover {
            opacity: 1;
            text-decoration: underline;
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            padding: 0 16px;
            margin-top: -4vh;
        }

        .logo {
            font-size: clamp(36px, 7vw, 56px);
            font-weight: 500;
            letter-spacing: -1px;
            margin-bottom: 24px;
            color: var(--text-color);
            user-select: none;
        }

        .search-box {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 584px;
            height: 46px;
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 0 14px;
            transition: box-shadow 0.2s, border-color 0.2s;
            background-color: var(--surface-color);
        }

        .search-box:hover, .search-box:focus-within {
            box-shadow: 0 1px 6px var(--shadow-color);
            border-color: var(--text-secondary);
        }

        .search-icon {
            width: 20px;
            height: 20px;
            fill: var(--text-secondary);
            margin-right: 12px;
        }

        .search-input {
            flex-grow: 1;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text-color);
            font-size: 16px;
        }

        /* Sekce pro ikony (Apps & Contributors) */
        .shortcuts-section {
            width: 100%;
            max-width: 650px;
            margin-top: 36px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 4px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 16px;
        }

        .shortcut-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            padding: 10px;
            border-radius: 8px;
            transition: background-color 0.2s;
        }

        .shortcut-item:hover {
            background-color: var(--hover-bg);
        }

        .shortcut-icon-wrapper {
            width: 48px;
            height: 48px;
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            overflow: hidden;
        }

        .shortcut-icon-wrapper img {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        .shortcut-name {
            font-size: 12px;
            color: var(--text-color);
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        footer {
            background-color: var(--surface-color);
            color: var(--text-secondary);
            font-size: 13px;
            border-top: 1px solid var(--border-color);
        }

        .footer-row {
            padding: 15px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .footer-links {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: var(--text-secondary);
            text-decoration: none;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <a href="https://github.com/your-username/zalorforge" target="_blank">GitHub</a>
        <a href="https://zalorforge.pages.dev">Ecosystem</a>
    </header>

    <main>
        <div class="logo">ZalorForge</div>

        <div class="search-box">
            <svg class="search-icon" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path></svg>
            <input type="text" class="search-input" placeholder="Search ecosystem or type command..." autofocus>
        </div>

        <!-- Dynamické sekce pro Apps a Contributors -->
        <div class="shortcuts-section">
            <div>
                <div class="section-title">Applications</div>
                <div id="apps-grid" class="grid-container"></div>
            </div>

            <div>
                <div class="section-title">Contributors</div>
                <div id="contributors-grid" class="grid-container"></div>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-row">
            <span>Ethical • Sustainable • High Performance</span>
            <div class="footer-links">
                <a href="https://zalorforge.pages.dev">ZalorForge Cloud</a>
                <a href="https://github.com/your-username/zalorforge" target="_blank">Source Code</a>
            </div>
        </div>
    </footer>

    <!-- Načtení datových skriptů -->
    <script src="apps.js"></script>
    <script src="contributors.js"></script>
    <script>
        // Funkce pro vykreslení položek do mřížky
        function renderGrid(containerId, items) {
            const container = document.getElementById(containerId);
            if (!container || !Array.isArray(items)) return;
            
            container.innerHTML = items.map(item => `
                <a href="${item.url}" class="shortcut-item" target="_blank" rel="noopener noreferrer">
                    <div class="shortcut-icon-wrapper">
                        <img src="${item.logo}" alt="${item.name}" onerror="this.src='https://api.iconify.design/lucide:box.svg?color=%239aa0a6'">
                    </div>
                    <span class="shortcut-name">${item.name}</span>
                </a>
            `).join('');
        }

        // Inicializace po načtení stránky
        document.addEventListener("DOMContentLoaded", () => {
            if (typeof appsData !== 'undefined') renderGrid('apps-grid', appsData);
            if (typeof contributorsData !== 'undefined') renderGrid('contributors-grid', contributorsData);
        });
    </script>
</body>
</html>
