<!DOCTYPE html>
<html lang="cs" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zalorforge</title>
    <style>
        :root[data-theme="dark"] {
            --bg-color: #0b0f19;
            --surface-color: #131b2e;
            --surface-hover: #1c2640;
            --text-color: #f3f6fc;
            --text-secondary: #8b9ab3;
            --border-color: #26334f;
            --accent-color: #3b82f6;
            --accent-gradient: linear-gradient(135deg, #3b82f6, #6366f1);
            --shadow: 0 12px 35px -10px rgba(0, 0, 0, 0.6);
        }

        :root[data-theme="light"] {
            --bg-color: #f8fafc;
            --surface-color: #ffffff;
            --surface-hover: #f1f5f9;
            --text-color: #0f172a;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --accent-color: #2563eb;
            --accent-gradient: linear-gradient(135deg, #2563eb, #4f46e5);
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s, color 0.3s;
        }

        .app-container {
            display: flex;
            width: 100%;
            height: 100%;
            max-width: 1400px;
            background-color: var(--bg-color);
            position: relative;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 380px;
            background-color: var(--surface-color);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 24px;
            gap: 16px;
            z-index: 10;
            flex-shrink: 0;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .brand {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand h2 {
            font-size: 21px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .settings-bar {
            display: flex;
            gap: 10px;
        }

        .settings-btn {
            flex: 1;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 9px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .settings-btn:hover {
            border-color: var(--accent-color);
            background: var(--surface-hover);
            transform: translateY(-1px);
        }

        .search-box-wrapper {
            position: relative;
        }

        .search-box-wrapper svg {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 15px;
            height: 15px;
            stroke: var(--text-secondary);
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            padding: 10px 14px 10px 36px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
            overflow-y: auto;
        }

        .nav-menu::-webkit-scrollbar {
            width: 4px;
        }
        .nav-menu::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 10px;
        }

        .nav-item {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-item:hover {
            border-color: var(--accent-color);
            background: var(--surface-hover);
            transform: translateX(2px);
        }

        .nav-item.active {
            border-color: var(--accent-color);
            background: var(--surface-hover);
            box-shadow: var(--shadow);
        }

        /* Main Content */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 32px;
            overflow-y: auto;
            background-color: var(--bg-color);
            animation: fadeIn 0.3s ease;
        }

        .section-container {
            display: flex;
            flex-direction: column;
            gap: 24px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        .section-header h2 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .section-header p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
        }

        .card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            text-decoration: none;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            animation: slideIn 0.3s ease;
        }

        .card:hover {
            border-color: var(--accent-color);
            transform: translateY(-3px);
            box-shadow: var(--shadow);
            background-color: var(--surface-hover);
        }

        .card-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border-color);
        }

        .card-info h3 {
            font-size: 15px;
            font-weight: 700;
            word-break: break-all;
        }

        /* Mobile Bottom Bar */
        .mobile-nav-bar {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background-color: var(--surface-color);
            border-top: 1px solid var(--border-color);
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .mobile-nav-item {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .mobile-nav-item svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .mobile-nav-item.active {
            color: var(--accent-color);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 800px) {
            body {
                align-items: flex-start;
            }

            .app-container {
                flex-direction: column;
                height: calc(100vh - 65px);
                height: calc(100dvh - 65px);
            }

            .sidebar {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                border-right: none;
                display: none;
            }

            .sidebar.mobile-active {
                display: flex;
            }

            .main-content {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                padding: 20px;
                display: none;
            }

            .main-content.mobile-active {
                display: flex;
            }

            .mobile-nav-bar {
                display: flex;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar mobile-active" id="sidebarPanel">
            <div class="brand">
                <h2>Zalorforge</h2>
            </div>
            
            <div class="settings-bar">
                <button class="settings-btn" onclick="toggleTheme()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    <span id="themeBtnText">Theme</span>
                </button>
            </div>

            <div class="search-box-wrapper">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="searchInput" class="search-input" placeholder="Hledat..." oninput="handleSearch()">
            </div>

            <div class="nav-menu" id="navMenu">
                <div class="nav-item active" onclick="switchSection('contributors')">
                    <span>Contributors</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                </div>
                <div class="nav-item" onclick="switchSection('apps')">
                    <span>Apps</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content" id="mainContentPanel">
            <div class="section-container" id="dynamicContainer"></div>
        </div>

        <!-- Mobile Bottom Bar -->
        <div class="mobile-nav-bar">
            <button class="mobile-nav-item active" id="mobileNavContribBtn" onclick="switchMobileSection('contributors')">
                <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
                <span>Contributors</span>
            </button>
            <button class="mobile-nav-item" id="mobileNavAppsBtn" onclick="switchMobileSection('apps')">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                <span>Apps</span>
            </button>
        </div>
    </div>

    <!-- Načtení externích souborů contributors.js a apps.js -->
    <script src="contributors.js"></script>
    <script src="apps.js"></script>

    <!-- Hlavní logika pro parsování a vyhledávání -->
    <script>
        let currentTheme = localStorage.getItem('zalorforge_theme') || 'dark';
        let activeSection = 'contributors';
        let searchQuery = '';

        document.documentElement.setAttribute('data-theme', currentTheme);

        function toggleTheme() {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', currentTheme);
            localStorage.setItem('zalorforge_theme', currentTheme);
        }

        function switchSection(section) {
            activeSection = section;
            searchQuery = '';
            document.getElementById('searchInput').value = '';
            
            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => item.classList.remove('active'));
            
            if (section === 'contributors') {
                navItems[0].classList.add('active');
            } else {
                navItems[1].classList.add('active');
            }

            renderContent();
        }

        function switchMobileSection(section) {
            switchSection(section);
            const mobContrib = document.getElementById('mobileNavContribBtn');
            const mobApps = document.getElementById('mobileNavAppsBtn');
            const sidebar = document.getElementById('sidebarPanel');
            const main = document.getElementById('mainContentPanel');

            if (section === 'contributors') {
                mobContrib.classList.add('active');
                mobApps.classList.remove('active');
            } else {
                mobApps.classList.add('active');
                mobContrib.classList.remove('active');
            }
            sidebar.classList.remove('mobile-active');
            main.classList.add('mobile-active');
        }

        function handleSearch() {
            searchQuery = document.getElementById('searchInput').value.toLowerCase();
            renderContent();
        }

        function renderContent() {
            const container = document.getElementById('dynamicContainer');
            container.innerHTML = '';

            if (activeSection === 'contributors') {
                const header = document.createElement('div');
                header.className = 'section-header';
                header.innerHTML = `<h2>Contributors</h2><p>Seznam přispěvatelů projektu Zalorforge.</p>`;
                container.appendChild(header);

                const grid = document.createElement('div');
                grid.className = 'grid-cards';

                // Kontrola, zda pole contributorsData existuje (načteno z contributors.js)
                const data = (typeof contributorsData !== 'undefined') ? contributorsData : [];
                const filtered = data.filter(item => item.name.toLowerCase().includes(searchQuery));

                filtered.forEach(c => {
                    const card = document.createElement('a');
                    card.className = 'card';
                    card.href = c.url;
                    card.target = '_blank';
                    card.rel = 'noopener noreferrer';
                    card.innerHTML = `
                        <img src="${c.logo}" alt="${c.name}" class="card-avatar">
                        <div class="card-info">
                            <h3>${c.name}</h3>
                        </div>
                    `;
                    grid.appendChild(card);
                });
                container.appendChild(grid);

            } else {
                const header = document.createElement('div');
                header.className = 'section-header';
                header.innerHTML = `<h2>Apps</h2><p>Seznam aplikací v ekosystému Zalorforge.</p>`;
                container.appendChild(header);

                const grid = document.createElement('div');
                grid.className = 'grid-cards';

                // Kontrola, zda pole appsData existuje (načteno z apps.js)
                const data = (typeof appsData !== 'undefined') ? appsData : [];
                const filtered = data.filter(item => item.name.toLowerCase().includes(searchQuery));

                filtered.forEach(a => {
                    const card = document.createElement('a');
                    card.className = 'card';
                    card.href = a.url;
                    if (a.url !== '#') {
                        card.target = '_blank';
                        card.rel = 'noopener noreferrer';
                    }
                    card.innerHTML = `
                        <img src="${a.logo}" alt="${a.name}" class="card-avatar">
                        <div class="card-info">
                            <h3>${a.name}</h3>
                        </div>
                    `;
                    grid.appendChild(card);
                });
                container.appendChild(grid);
            }
        }

        // Prvotní vykreslení obsahu po načtení skriptů
        renderContent();
    </script>
</body>
</html>
