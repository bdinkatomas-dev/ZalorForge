<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZalorForge — Ecosystem</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --surface-color: #161b22;
            --surface-hover: #1f242c;
            --text-color: #f0f6fc;
            --text-secondary: #8b949e;
            --border-color: #30363d;
            --accent-color: #58a6ff;
            --accent-gradient: linear-gradient(135deg, #58a6ff, #bc8cff);
            --shadow: 0 12px 35px -10px rgba(0, 0, 0, 0.6);
            --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
            justify-content: space-between;
            overflow-x: hidden;
        }

        /* Vylepšené plynulé animace */
        @keyframes heroEntrance {
            0% { opacity: 0; transform: translateY(24px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes cardPop {
            0% { opacity: 0; transform: translateY(16px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        header {
            display: flex;
            justify-content: flex-end;
            padding: 24px 32px;
            gap: 20px;
            align-items: center;
            animation: heroEntrance 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        header a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: color 0.2s;
        }

        header a:hover {
            color: var(--accent-color);
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
            padding: 0 20px 60px 20px;
            max-width: 760px;
            width: 100%;
            margin: 0 auto;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 36px;
            animation: heroEntrance 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .logo {
            font-size: clamp(40px, 8vw, 60px);
            font-weight: 800;
            letter-spacing: -1.5px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            user-select: none;
            margin-bottom: 8px;
        }

        .tagline {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .search-box {
            display: flex;
            align-items: center;
            width: 100%;
            height: 54px;
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 0 20px;
            box-shadow: var(--shadow);
            transition: var(--transition);
            animation: heroEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .search-box:hover, .search-box:focus-within {
            border-color: var(--accent-color);
            box-shadow: 0 6px 25px rgba(88, 166, 255, 0.2);
            transform: translateY(-2px);
        }

        .search-icon {
            width: 20px;
            height: 20px;
            fill: var(--text-secondary);
            margin-right: 14px;
            transition: fill 0.2s;
            flex-shrink: 0;
        }

        .search-box:focus-within .search-icon {
            fill: var(--accent-color);
        }

        .search-input {
            flex-grow: 1;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text-color);
            font-size: 16px;
        }

        .search-input::placeholder {
            color: var(--text-secondary);
        }

        /* Sekce pro ikony a mřížku */
        .content-sections {
            width: 100%;
            margin-top: 44px;
            display: flex;
            flex-direction: column;
            gap: 36px;
        }

        .section-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .section-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-secondary);
            font-weight: 600;
            padding-left: 4px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(95px, 1fr));
            gap: 16px;
        }

        .shortcut-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            padding: 14px 8px;
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            transition: var(--transition);
            animation: cardPop 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .shortcut-item:hover {
            background-color: var(--surface-hover);
            border-color: var(--accent-color);
            transform: translateY(-4px);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.4);
        }

        .shortcut-item:active {
            transform: translateY(-1px);
        }

        .shortcut-icon-wrapper {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: var(--transition);
        }

        .shortcut-item:hover .shortcut-icon-wrapper {
            border-color: rgba(88, 166, 255, 0.3);
            transform: scale(1.05);
        }

        .shortcut-icon-wrapper img {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        .shortcut-name {
            font-size: 12px;
            color: var(--text-color);
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            font-weight: 500;
        }

        footer {
            background-color: var(--surface-color);
            color: var(--text-secondary);
            font-size: 12px;
            border-top: 1px solid var(--border-color);
            padding: 20px 32px;
        }

        .footer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .footer-links {
            display: flex;
            gap: 20px;
        }

        .footer-links a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer-links a:hover {
            color: var(--accent-color);
        }

        /* Optimalizované mobilní UI */
        @media (max-width: 600px) {
            header {
                padding: 16px 20px;
            }

            main {
                padding: 0 16px 40px 16px;
            }

            .logo-container {
                margin-bottom: 24px;
            }

            .search-box {
                height: 48px;
                padding: 0 16px;
            }

            .grid-container {
                grid-template-columns: repeat(3, 1fr);
                gap: 12px;
            }

            .shortcut-item {
                padding: 12px 6px;
                border-radius: 14px;
            }

            .shortcut-icon-wrapper {
                width: 42px;
                height: 42px;
                border-radius: 12px;
                margin-bottom: 8px;
            }

            footer {
                padding: 16px 20px;
                text-align: center;
            }

            .footer-row {
                flex-direction: column;
                justify-content: center;
                gap: 12px;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="https://github.com/zalorforge" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a href="#ecosystem">Ecosystem</a>
    </header>

    <main>
        <div class="logo-container">
            <h1 class="logo">ZalorForge</h1>
            <p class="tagline">Ethical • High-Performance • Sustainable Ecosystem</p>
        </div>

        <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="searchInput" class="search-input" placeholder="Search apps, commands or documents...">
        </div>

        <div class="content-sections">
            <div class="section-group">
                <div class="section-title">Applications</div>
                <div id="apps-grid" class="grid-container"></div>
            </div>

            <div class="section-group">
                <div class="section-title">Contributors</div>
                <div id="contributors-grid" class="grid-container"></div>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-row">
            <span>© ZalorForge Project • Zero-Cost Infrastructure</span>
            <div class="footer-links">
                <a href="https://turso.tech" target="_blank" rel="noopener noreferrer">Turso DB</a>
                <a href="https://pages.cloudflare.com" target="_blank" rel="noopener noreferrer">Cloudflare</a>
                <a href="https://render.com" target="_blank" rel="noopener noreferrer">Render API</a>
            </div>
        </div>
    </footer>

    <!-- Načtení dat -->
    <script src="apps.js"></script>
    <script src="contributors.js"></script>
    <script>
        let allApps = [];
        let allContributors = [];

        function renderGrid(containerId, items) {
            const container = document.getElementById(containerId);
            if (!container || !Array.isArray(items)) return;
            
            if (items.length === 0) {
                container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-secondary); font-size: 13px; padding: 12px;">Žádné výsledky</div>`;
                return;
            }

            container.innerHTML = items.map((item, index) => `
                <a href="${item.url}" class="shortcut-item" target="_blank" rel="noopener noreferrer" style="animation-delay: ${index * 0.04}s">
                    <div class="shortcut-icon-wrapper">
                        <img src="${item.logo}" alt="${item.name}" onerror="this.src='https://api.iconify.design/lucide:box.svg?color=%238b949e'">
                    </div>
                    <span class="shortcut-name">${item.name}</span>
                </a>
            `).join('');
        }

        function filterAndRender() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();

            const filteredApps = allApps.filter(item => item.name.toLowerCase().includes(query));
            const filteredContributors = allContributors.filter(item => item.name.toLowerCase().includes(query));

            renderGrid('apps-grid', filteredApps);
            renderGrid('contributors-grid', filteredContributors);
        }

        document.addEventListener("DOMContentLoaded", () => {
            if (typeof appsData !== 'undefined') allApps = appsData;
            if (typeof contributorsData !== 'undefined') allContributors = contributorsData;

            renderGrid('apps-grid', allApps);
            renderGrid('contributors-grid', allContributors);

            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.addEventListener('input', filterAndRender);
            }
        });
    </script>
</body>
</html>
