<!DOCTYPE html>
<html lang="cs" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZalorForge — Ecosystem</title>
    <style>
        :root[data-theme="dark"] {
            --bg-color: #0d1117;
            --surface-color: #161b22;
            --surface-hover: #1f242c;
            --text-color: #f0f6fc;
            --text-secondary: #8b949e;
            --border-color: #30363d;
            --accent-color: #58a6ff;
            --accent-gradient: linear-gradient(135deg, #58a6ff, #bc8cff);
            --shadow: 0 12px 35px -10px rgba(0, 0, 0, 0.6);
            --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        :root[data-theme="light"] {
            --bg-color: #f8fafc;
            --surface-color: #ffffff;
            --surface-hover: #f1f5f9;
            --text-color: #0f172a;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --accent-color: #2563eb;
            --accent-gradient: linear-gradient(135deg, #2563eb, #4f46e5);
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
            justify-content: space-between;
            overflow-x: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        @keyframes heroEntrance {
            0% { opacity: 0; transform: translateY(24px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes cardPop {
            0% { opacity: 0; transform: translateY(16px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        header {
            display: flex;
            justify-content: space-between;
            padding: 24px 32px;
            align-items: center;
            animation: heroEntrance 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
        }

        .header-left {
            display: flex;
            gap: 12px;
        }

        .control-btn {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 14px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .control-btn:hover {
            border-color: var(--accent-color);
            background: var(--surface-hover);
            transform: translateY(-1px);
        }

        .control-btn svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        .header-right {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .header-right a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .header-right a:hover {
            color: var(--accent-color);
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
            padding: 0 20px 60px 20px;
            max-width: 760px;
            width: 100%;
            margin: 0 auto;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 36px;
            animation: heroEntrance 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .logo {
            font-size: clamp(40px, 8vw, 60px);
            font-weight: 800;
            letter-spacing: -1.5px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            user-select: none;
            margin-bottom: 8px;
        }

        .tagline {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .search-box {
            display: flex;
            align-items: center;
            width: 100%;
            height: 54px;
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 0 20px;
            box-shadow: var(--shadow);
            transition: var(--transition);
            animation: heroEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .search-box:hover, .search-box:focus-within {
            border-color: var(--accent-color);
            box-shadow: 0 6px 25px rgba(88, 166, 255, 0.15);
            transform: translateY(-2px);
        }

        .search-icon {
            width: 20px;
            height: 20px;
            fill: var(--text-secondary);
            margin-right: 14px;
            transition: fill 0.2s;
            flex-shrink: 0;
        }

        .search-box:focus-within .search-icon {
            fill: var(--accent-color);
        }

        .search-input {
            flex-grow: 1;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text-color);
            font-size: 16px;
        }

        .search-input::placeholder {
            color: var(--text-secondary);
        }

        .content-sections {
            width: 100%;
            margin-top: 44px;
            display: flex;
            flex-direction: column;
            gap: 36px;
        }

        .section-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .section-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-secondary);
            font-weight: 600;
            padding-left: 4px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(95px, 1fr));
            gap: 16px;
        }

        .shortcut-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            padding: 14px 8px;
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            transition: var(--transition);
            animation: cardPop 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .shortcut-item:hover {
            background-color: var(--surface-hover);
            border-color: var(--accent-color);
            transform: translateY(-4px);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.2);
        }

        .shortcut-item:active {
            transform: translateY(-1px);
        }

        .shortcut-icon-wrapper {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            overflow: hidden;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }

        .shortcut-item:hover .shortcut-icon-wrapper {
            border-color: var(--accent-color);
            transform: scale(1.05);
        }

        /* Upraveno pro správné renderování SVG prvků vložených přes odkaz / inline */
        .shortcut-icon-wrapper img,
        .shortcut-icon-wrapper svg {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

        .shortcut-name {
            font-size: 12px;
            color: var(--text-color);
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            font-weight: 500;
        }

        footer {
            background-color: var(--surface-color);
            color: var(--text-secondary);
            font-size: 12px;
            border-top: 1px solid var(--border-color);
            padding: 20px 32px;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .footer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .footer-links {
            display: flex;
            gap: 20px;
        }

        .footer-links a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer-links a:hover {
            color: var(--accent-color);
        }

        @media (max-width: 600px) {
            header {
                padding: 16px 20px;
            }

            main {
                padding: 0 16px 40px 16px;
            }

            .logo-container {
                margin-bottom: 24px;
            }

            .search-box {
                height: 48px;
                padding: 0 16px;
            }

            .grid-container {
                grid-template-columns: repeat(3, 1fr);
                gap: 12px;
            }

            .shortcut-item {
                padding: 12px 6px;
                border-radius: 14px;
            }

            .shortcut-icon-wrapper {
                width: 42px;
                height: 42px;
                border-radius: 12px;
                margin-bottom: 8px;
            }

            footer {
                padding: 16px 20px;
                text-align: center;
            }

            .footer-row {
                flex-direction: column;
                justify-content: center;
                gap: 12px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <button class="control-btn" onclick="toggleTheme()">
                <svg viewBox="0 0 24 24" id="themeIcon"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                <span id="themeLabel">Dark</span>
            </button>
            <button class="control-btn" onclick="toggleLanguage()">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                <span id="langLabel">CZ</span>
            </button>
        </div>
        <div class="header-right">
            <a href="https://github.com/zalorforge" target="_blank" rel="noopener noreferrer">GitHub</a>
            <a href="#ecosystem" id="navEcosystem">Ecosystem</a>
        </div>
    </header>

    <main>
        <div class="logo-container">
            <h1 class="logo">ZalorForge</h1>
            <p class="tagline" id="taglineText">Ethical • High-Performance • Sustainable Ecosystem</p>
        </div>

        <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="searchInput" class="search-input" placeholder="Search apps, commands or documents...">
        </div>

        <div class="content-sections">
            <div class="section-group">
                <div class="section-title" id="appsTitle">Applications</div>
                <div id="apps-grid" class="grid-container"></div>
            </div>

            <div class="section-group">
                <div class="section-title" id="contributorsTitle">Contributors</div>
                <div id="contributors-grid" class="grid-container"></div>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-row">
            <span id="footerCopy">© ZalorForge Project • Zero-Cost Infrastructure</span>
            <div class="footer-links">
                <a href="https://turso.tech" target="_blank" rel="noopener noreferrer">Turso DB</a>
                <a href="https://pages.cloudflare.com" target="_blank" rel="noopener noreferrer">Cloudflare</a>
                <a href="https://render.com" target="_blank" rel="noopener noreferrer">Render API</a>
            </div>
        </div>
    </footer>

    <!-- Načtení dat -->
    <script src="apps.js"></script>
    <script src="contributors.js"></script>
    <script>
        const i18n = {
            en: {
                searchPlaceholder: "Search apps, commands or documents...",
                appsTitle: "Applications",
                contributorsTitle: "Contributors",
                ecosystem: "Ecosystem",
                tagline: "Ethical • High-Performance • Sustainable Ecosystem",
                noResults: "No results found"
            },
            cs: {
                searchPlaceholder: "Hledat aplikace, příkazy nebo dokumenty...",
                appsTitle: "Aplikace",
                contributorsTitle: "Přispěvatelé",
                ecosystem: "Ekosystém",
                tagline: "Etický • Vysoce výkonný • Udržitelný ekosystém",
                noResults: "Žádné výsledky"
            }
        };

        let currentLang = localStorage.getItem('zalorforge_lang') || 'cs';
        let currentTheme = localStorage.getItem('zalorforge_theme') || 'dark';
        let allApps = [];
        let allContributors = [];

        document.documentElement.setAttribute('data-theme', currentTheme);

        function updateUIStrings() {
            const t = i18n[currentLang];
            document.getElementById('searchInput').placeholder = t.searchPlaceholder;
            document.getElementById('appsTitle').textContent = t.appsTitle;
            document.getElementById('contributorsTitle').textContent = t.contributorsTitle;
            document.getElementById('navEcosystem').textContent = t.ecosystem;
            document.getElementById('taglineText').textContent = t.tagline;
            document.getElementById('langLabel').textContent = currentLang.toUpperCase();
            
            const themeLabel = document.getElementById('themeLabel');
            themeLabel.textContent = currentTheme === 'dark' ? (currentLang === 'cs' ? 'Tmavý' : 'Dark') : (currentLang === 'cs' ? 'Světlý' : 'Light');
        }

        function toggleTheme() {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', currentTheme);
            localStorage.setItem('zalorforge_theme', currentTheme);
            updateUIStrings();
        }

        function toggleLanguage() {
            currentLang = currentLang === 'cs' ? 'en' : 'cs';
            localStorage.setItem('zalorforge_lang', currentLang);
            updateUIStrings();
        }

        function renderGrid(containerId, items) {
            const container = document.getElementById(containerId);
            if (!container || !Array.isArray(items)) return;
            
            const t = i18n[currentLang];
            if (items.length === 0) {
                container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-secondary); font-size: 13px; padding: 12px;">${t.noResults}</div>`;
                return;
            }

            container.innerHTML = items.map((item, index) => {
                let logoContent = '';
                // Rozpoznání, zda logo je přímá SVG cesta/odkaz končící na .svg nebo obsahující data-svg / url
                if (item.logo && (item.logo.trim().startsWith('<svg') || item.logo.trim().startsWith('data:image/svg+xml'))) {
                    logoContent = item.logo;
                } else if (item.logo && item.logo.toLowerCase().endsWith('.svg')) {
                    // Pokud jde o URL na externí soubor SVG, načteme ho jako obrázek s podporou fallbacku
                    logoContent = `<img src="${item.logo}" alt="${item.name}" onerror="this.onerror=null; this.src='https://api.iconify.design/lucide:box.svg?color=%238b949e'">`;
                } else {
                    logoContent = `<img src="${item.logo || 'https://api.iconify.design/lucide:box.svg?color=%238b949e'}" alt="${item.name}" onerror="this.src='https://api.iconify.design/lucide:box.svg?color=%238b949e'">`;
                }

                return `
                    <a href="${item.url}" class="shortcut-item" target="_blank" rel="noopener noreferrer" style="animation-delay: ${index * 0.04}s">
                        <div class="shortcut-icon-wrapper">
                            ${logoContent}
                        </div>
                        <span class="shortcut-name">${item.name}</span>
                    </a>
                `;
            }).join('');
        }

        function filterAndRender() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();

            const filteredApps = allApps.filter(item => item.name.toLowerCase().includes(query));
            const filteredContributors = allContributors.filter(item => item.name.toLowerCase().includes(query));

            renderGrid('apps-grid', filteredApps);
            renderGrid('contributors-grid', filteredContributors);
        }

        document.addEventListener("DOMContentLoaded", () => {
            if (typeof appsData !== 'undefined') allApps = appsData;
            if (typeof contributorsData !== 'undefined') allContributors = contributorsData;

            updateUIStrings();
            renderGrid('apps-grid', allApps);
            renderGrid('contributors-grid', allContributors);

            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.addEventListener('input', filterAndRender);
            }
        });
    </script>
</body>
</html>
