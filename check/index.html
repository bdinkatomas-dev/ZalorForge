<!DOCTYPE html>
<html lang="cs" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Check — Kalendář & Úkoly</title>
    <style>
        :root[data-theme="dark"] {
            --bg-color: #0d1117;
            --surface-color: #161b22;
            --surface-hover: #1f242c;
            --text-color: #f0f6fc;
            --text-secondary: #8b949e;
            --border-color: #30363d;
            --accent-color: #58a6ff;
            --accent-gradient: linear-gradient(135deg, #58a6ff, #bc8cff);
            --danger-color: #f87171;
            --success-color: #3fb950;
            --shadow: 0 12px 35px -10px rgba(0, 0, 0, 0.6);
            --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        :root[data-theme="light"] {
            --bg-color: #f8fafc;
            --surface-color: #ffffff;
            --surface-hover: #f1f5f9;
            --text-color: #0f172a;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --accent-color: #2563eb;
            --accent-gradient: linear-gradient(135deg, #2563eb, #4f46e5);
            --danger-color: #ef4444;
            --success-color: #16a34a;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
            transition: background-color 0.3s, color 0.3s;
        }

        header {
            display: flex;
            justify-content: space-between;
            padding: 20px 32px;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--surface-color);
        }

        .header-left, .header-right {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .control-btn {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 14px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
            text-decoration: none;
            white-space: nowrap;
        }

        .control-btn:hover {
            border-color: var(--accent-color);
            background: var(--surface-hover);
        }

        .control-btn.primary {
            background: var(--accent-gradient);
            color: #ffffff;
            border: none;
        }

        main {
            flex-grow: 1;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 32px 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .nav-tabs {
            display: flex;
            gap: 8px;
            background: var(--surface-color);
            padding: 6px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            width: fit-content;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: var(--transition);
        }

        .tab-btn.active {
            background: var(--accent-gradient);
            color: white;
        }

        .card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            box-shadow: var(--shadow);
        }

        .view-section {
            display: none;
            flex-direction: column;
            gap: 20px;
        }

        .view-section.active {
            display: flex;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
        }

        .form-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        input, select, textarea {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            flex-grow: 1;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent-color);
        }

        .items-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            transition: var(--transition);
            gap: 12px;
        }

        .item-row:hover {
            border-color: var(--accent-color);
        }

        .item-info {
            display: flex;
            align-items: center;
            gap: 14px;
            overflow: hidden;
        }

        .item-title {
            font-weight: 500;
            font-size: 14px;
            word-break: break-word;
        }

        .item-title.completed {
            text-decoration: line-through;
            color: var(--text-secondary);
        }

        .item-meta {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: var(--danger-color);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            padding: 6px 10px;
            border-radius: 8px;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .delete-btn:hover {
            background: rgba(248, 113, 113, 0.1);
        }

        /* Kalendář mřížka */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            text-align: center;
        }

        .calendar-day-header {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            padding: 6px 0;
            text-transform: uppercase;
        }

        .calendar-cell {
            aspect-ratio: 1;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 4px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .calendar-cell:hover {
            border-color: var(--accent-color);
        }

        .calendar-cell.today {
            border-color: var(--accent-color);
            background: var(--surface-hover);
        }

        .calendar-date {
            font-size: 13px;
            font-weight: 600;
        }

        .event-dot {
            width: 5px;
            height: 5px;
            background-color: var(--accent-color);
            border-radius: 50%;
        }

        /* Responzivita pro mobily */
        @media (max-width: 600px) {
            header {
                padding: 14px 16px;
            }
            main {
                padding: 16px 12px;
                gap: 16px;
            }
            .card {
                padding: 16px;
                border-radius: 16px;
            }
            .form-row {
                flex-direction: column;
            }
            .control-btn {
                padding: 6px 10px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <a href="#" class="logo">Check</a>
        </div>
        <div class="header-right">
            <button class="control-btn" onclick="toggleTheme()">
                <span id="themeLabel">Tmavý</span>
            </button>
            <button class="control-btn" onclick="toggleLanguage()">
                <span id="langLabel">CZ</span>
            </button>
        </div>
    </header>

    <main>
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('tasks')" id="tabTasksBtn">Úkoly</button>
            <button class="tab-btn" onclick="switchTab('calendar')" id="tabCalendarBtn">Kalendář</button>
        </div>

        <!-- SEKCE ÚKOLY -->
        <div id="tasksView" class="view-section active card">
            <div class="section-header">
                <span class="section-title" id="tasksTitle">Správa úkolů</span>
            </div>
            <div class="form-row">
                <input type="text" id="taskInput" placeholder="Nový úkol...">
                <input type="date" id="taskDate">
                <button class="control-btn primary" onclick="addTask()" id="addTaskBtn">Přidat úkol</button>
            </div>
            <div id="tasksList" class="items-list"></div>
        </div>

        <!-- SEKCE KALENDÁŘ -->
        <div id="calendarView" class="view-section card">
            <div class="section-header">
                <span class="section-title" id="calMonthYear">Září 2026</span>
                <div style="display: flex; gap: 6px;">
                    <button class="control-btn" onclick="changeMonth(-1)">‹</button>
                    <button class="control-btn" onclick="changeMonth(1)">›</button>
                </div>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
            <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 12px;">
                <h4 style="font-size: 14px;" id="eventHeader">Události dne</h4>
                <div class="form-row">
                    <input type="text" id="eventInput" placeholder="Nová událost...">
                    <button class="control-btn primary" onclick="addEvent()" id="addEventBtn">Přidat událost</button>
                </div>
                <div id="eventsList" class="items-list"></div>
            </div>
        </div>
    </main>

    <script>
        const i18n = {
            cs: {
                tasks: "Úkoly",
                calendar: "Kalendář",
                taskManager: "Správa úkolů",
                newTask: "Nový úkol...",
                addTask: "Přidat úkol",
                newEvent: "Nová událost...",
                addEvent: "Přidat událost",
                dayEvents: "Události dne",
                noTasks: "Žádné úkoly",
                noEvents: "Žádné události pro tento den",
                delete: "Smazat",
                dark: "Tmavý",
                light: "Světlý",
                months: ["Leden", "Únor", "Březen", "Duben", "Květen", "Červen", "Červenec", "Srpen", "Září", "Říjen", "Listopad", "Prosinec"],
                days: ["Po", "Út", "St", "Čt", "Pá", "So", "Ne"]
            },
            en: {
                tasks: "Tasks",
                calendar: "Calendar",
                taskManager: "Task Manager",
                newTask: "New task...",
                addTask: "Add task",
                newEvent: "New event...",
                addEvent: "Add event",
                dayEvents: "Day Events",
                noTasks: "No tasks",
                noEvents: "No events for this day",
                delete: "Delete",
                dark: "Dark",
                light: "Light",
                months: ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"],
                days: ["Mo", "Tu", "We", "Th", "Fr", "Sa", "Su"]
            }
        };

        let currentLang = localStorage.getItem('check_lang') || 'cs';
        let currentTheme = localStorage.getItem('check_theme') || 'dark';
        let appData = { tasks: [], events: [] };
        let selectedDateStr = new Date().toISOString().split('T')[0];
        let currentDate = new Date();

        document.documentElement.setAttribute('data-theme', currentTheme);

        async function loadData() {
            let local = localStorage.getItem('check_app_data');
            if (local) {
                appData = JSON.parse(local);
            } else {
                try {
                    const userEmail = localStorage.getItem('zalorforge_email') || 'guest';
                    const res = await fetch(`/api/get-data?email=${encodeURIComponent(userEmail)}`);
                    if (res.ok) {
                        appData = await res.json();
                        localStorage.setItem('check_app_data', JSON.stringify(appData));
                    }
                } catch (e) {
                    console.log("Offline mode");
                }
            }
            updateTexts();
            renderTasks();
            renderCalendar();
        }

        async function saveDataToStorage() {
            localStorage.setItem('check_app_data', JSON.stringify(appData));
            try {
                const userEmail = localStorage.getItem('zalorforge_email') || 'guest';
                await fetch('/api/save-item', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: userEmail, data: appData })
                });
            } catch (e) {
                console.log("Saved locally only");
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));

            if (tab === 'tasks') {
                document.getElementById('tabTasksBtn').classList.add('active');
                document.getElementById('tasksView').classList.add('active');
            } else {
                document.getElementById('tabCalendarBtn').classList.add('active');
                document.getElementById('calendarView').classList.add('active');
                renderCalendar();
            }
        }

        function toggleTheme() {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', currentTheme);
            localStorage.setItem('check_theme', currentTheme);
            updateTexts();
        }

        function toggleLanguage() {
            currentLang = currentLang === 'cs' ? 'en' : 'cs';
            localStorage.setItem('check_lang', currentLang);
            updateTexts();
            renderTasks();
            renderCalendar();
        }

        function updateTexts() {
            const t = i18n[currentLang];
            document.getElementById('tabTasksBtn').textContent = t.tasks;
            document.getElementById('tabCalendarBtn').textContent = t.calendar;
            document.getElementById('tasksTitle').textContent = t.taskManager;
            document.getElementById('taskInput').placeholder = t.newTask;
            document.getElementById('addTaskBtn').textContent = t.addTask;
            document.getElementById('eventInput').placeholder = t.newEvent;
            document.getElementById('addEventBtn').textContent = t.addEvent;
            document.getElementById('langLabel').textContent = currentLang.toUpperCase();
            document.getElementById('themeLabel').textContent = currentTheme === 'dark' ? t.dark : t.light;
            document.getElementById('eventHeader').textContent = `${t.dayEvents} (${selectedDateStr})`;
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            const dateInput = document.getElementById('taskDate');
            if (!input.value.trim()) return;

            appData.tasks.push({
                id: Date.now(),
                text: input.value.trim(),
                date: dateInput.value || '',
                completed: false
            });

            input.value = '';
            dateInput.value = '';
            saveDataToStorage();
            renderTasks();
        }

        function toggleTask(id) {
            const task = appData.tasks.find(t => t.id === id);
            if (task) task.completed = !task.completed;
            saveDataToStorage();
            renderTasks();
        }

        function deleteTask(id) {
            appData.tasks = appData.tasks.filter(t => t.id !== id);
            saveDataToStorage();
            renderTasks();
        }

        function renderTasks() {
            const list = document.getElementById('tasksList');
            const t = i18n[currentLang];
            if (appData.tasks.length === 0) {
                list.innerHTML = `<div style="text-align:center; color:var(--text-secondary); font-size:13px; padding:12px;">${t.noTasks}</div>`;
                return;
            }

            list.innerHTML = appData.tasks.map(task => `
                <div class="item-row">
                    <div class="item-info">
                        <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${task.id})" style="cursor:pointer; width:18px; height:18px; flex-shrink:0;">
                        <div>
                            <div class="item-title ${task.completed ? 'completed' : ''}">${task.text}</div>
                            ${task.date ? `<div class="item-meta">📅 ${task.date}</div>` : ''}
                        </div>
                    </div>
                    <button class="delete-btn" onclick="deleteTask(${task.id})">${t.delete}</button>
                </div>
            `).join('');
        }

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            const monthYear = document.getElementById('calMonthYear');
            const t = i18n[currentLang];
            
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            monthYear.textContent = `${t.months[month]} ${year}`;

            grid.innerHTML = t.days.map(d => `<div class="calendar-day-header">${d}</div>`).join('');

            const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7;
            const totalDays = new Date(year, month + 1, 0).getDate();
            const todayStr = new Date().toISOString().split('T')[0];

            for (let i = 0; i < firstDayIndex; i++) {
                grid.innerHTML += `<div></div>`;
            }

            for (let day = 1; day <= totalDays; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const hasEvents = appData.events.some(e => e.date === dateStr);
                const isToday = dateStr === todayStr;

                grid.innerHTML += `
                    <div class="calendar-cell ${isToday ? 'today' : ''}" onclick="selectDate('${dateStr}')">
                        <span class="calendar-date">${day}</span>
                        ${hasEvents ? '<div class="event-dot"></div>' : ''}
                    </div>
                `;
            }
            renderEventsForSelectedDate();
        }

        function changeMonth(dir) {
            currentDate.setMonth(currentDate.getMonth() + dir);
            renderCalendar();
        }

        function selectDate(dateStr) {
            selectedDateStr = dateStr;
            updateTexts();
            renderEventsForSelectedDate();
        }

        function addEvent() {
            const input = document.getElementById('eventInput');
            if (!input.value.trim()) return;

            appData.events.push({
                id: Date.now(),
                text: input.value.trim(),
                date: selectedDateStr
            });

            input.value = '';
            saveDataToStorage();
            renderCalendar();
        }

        function deleteEvent(id) {
            appData.events = appData.events.filter(e => e.id !== id);
            saveDataToStorage();
            renderCalendar();
        }

        function renderEventsForSelectedDate() {
            const list = document.getElementById('eventsList');
            const t = i18n[currentLang];
            const dayEvents = appData.events.filter(e => e.date === selectedDateStr);

            if (dayEvents.length === 0) {
                list.innerHTML = `<div style="text-align:center; color:var(--text-secondary); font-size:13px; padding:12px;">${t.noEvents}</div>`;
                return;
            }

            list.innerHTML = dayEvents.map(e => `
                <div class="item-row">
                    <div class="item-title">${e.text}</div>
                    <button class="delete-btn" onclick="deleteEvent(${e.id})">${t.delete}</button>
                </div>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
