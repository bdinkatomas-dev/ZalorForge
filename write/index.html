<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZalorForge Wrive — Dokumenty & Úložiště</title>
    <link rel="shortcut icon" href="https://ssl.gstatic.com/docs/documents/images/docs-favicon-2026-v2.ico">
    <style>
        :root {
            --bg-color: #0d1117;
            --surface-color: #161b22;
            --surface-hover: #1f242c;
            --text-color: #f0f6fc;
            --text-secondary: #8b949e;
            --border-color: #30363d;
            --accent-color: #58a6ff;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
            overflow-x: hidden;
        }

        /* Plynulé animace */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--surface-color);
            animation: fadeInDown 0.5s ease-out;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-brand h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: var(--text-color);
        }

        .header-brand span {
            color: var(--accent-color);
            font-size: 12px;
            border: 1px solid var(--border-color);
            padding: 2px 8px;
            border-radius: 12px;
            background-color: var(--bg-color);
        }

        header nav {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        header nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: color 0.2s;
        }

        header nav a:hover {
            color: var(--accent-color);
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            padding: 40px 20px;
            animation: fadeInUp 0.7s ease-out;
        }

        .hero-section {
            text-align: center;
            margin-bottom: 32px;
        }

        .hero-title {
            font-size: clamp(32px, 6vw, 48px);
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }

        .hero-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .search-box {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 600px;
            height: 48px;
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 0 16px;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
        }

        .search-box:hover, .search-box:focus-within {
            border-color: var(--accent-color);
            box-shadow: 0 4px 20px rgba(88, 166, 255, 0.15);
        }

        .search-icon {
            width: 18px;
            height: 18px;
            fill: var(--text-secondary);
            margin-right: 12px;
        }

        .search-input {
            flex-grow: 1;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text-color);
            font-size: 15px;
        }

        .search-input::placeholder {
            color: var(--text-secondary);
        }

        /* Grid sekce pro Apps & Contributors */
        .content-sections {
            width: 100%;
            max-width: 680px;
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .section-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .section-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-secondary);
            font-weight: 600;
            padding-left: 4px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 14px;
        }

        .shortcut-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            padding: 12px 8px;
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .shortcut-item:hover {
            background-color: var(--surface-hover);
            border-color: var(--accent-color);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
        }

        .shortcut-icon-wrapper {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            background-color: rgba(255, 255, 255, 0.03);
        }

        .shortcut-icon-wrapper img {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }

        .shortcut-name {
            font-size: 11px;
            color: var(--text-color);
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            font-weight: 500;
        }

        footer {
            background-color: var(--surface-color);
            color: var(--text-secondary);
            font-size: 12px;
            border-top: 1px solid var(--border-color);
            padding: 16px 32px;
        }

        .footer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .footer-links {
            display: flex;
            gap: 20px;
        }

        .footer-links a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer-links a:hover {
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <header>
        <div class="header-brand">
            <h1>ZalorForge Wrive</h1>
            <span>v2.6</span>
        </div>
        <nav>
            <a href="https://github.com/zalorforge" target="_blank">GitHub</a>
            <a href="https://zalorforge.pages.dev">Ecosystem</a>
        </nav>
    </header>

    <main>
        <div class="hero-section">
            <h1 class="hero-title">Vítejte ve Wrive</h1>
            <p class="hero-subtitle">Bezpečné úložiště a dokumenty postavené na etických základech</p>
        </div>

        <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" class="search-input" placeholder="Hledat v dokumentech, aplikacích nebo příkazech..." autofocus>
        </div>

        <div class="content-sections">
            <div class="section-group">
                <div class="section-title">Aplikace & Nástroje (Apps)</div>
                <div id="apps-grid" class="grid-container"></div>
            </div>

            <div class="section-group">
                <div class="section-title">Přispěvatelé (Contributors)</div>
                <div id="contributors-grid" class="grid-container"></div>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-row">
            <span>© ZalorForge Wrive • Turso DB & Cloudflare Powered</span>
            <div class="footer-links">
                <a href="https://turso.tech" target="_blank">Turso DB</a>
                <a href="https://render.com" target="_blank">Render Server</a>
            </div>
        </div>
    </footer>

    <script src="apps.js"></script>
    <script src="contributors.js"></script>
    <script>
        function renderGrid(containerId, items) {
            const container = document.getElementById(containerId);
            if (!container || !Array.isArray(items)) return;
            
            container.innerHTML = items.map(item => `
                <a href="${item.url}" class="shortcut-item" target="_blank" rel="noopener noreferrer">
                    <div class="shortcut-icon-wrapper">
                        <img src="${item.logo}" alt="${item.name}" onerror="this.src='https://api.iconify.design/lucide:box.svg?color=%238b949e'">
                    </div>
                    <span class="shortcut-name">${item.name}</span>
                </a>
            `).join('');
        }

        document.addEventListener("DOMContentLoaded", () => {
            if (typeof appsData !== 'undefined') renderGrid('apps-grid', appsData);
            if (typeof contributorsData !== 'undefined') renderGrid('contributors-grid', contributorsData);
        });
    </script>
</body>
</html>
