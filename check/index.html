<!DOCTYPE html>
<html lang="cs" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zalorforge-check — Calendar & Tasks</title>
    <style>
        :root[data-theme="dark"] {
            --bg-color: #0d1117;
            --surface-color: #161b22;
            --surface-hover: #21262d;
            --text-color: #f0f6fc;
            --text-secondary: #8b949e;
            --border-color: #30363d;
            --accent-color: #58a6ff;
            --event-color: #d29922;
            --danger-color: #ff7b72;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        :root[data-theme="light"] {
            --bg-color: #f8f9fa;
            --surface-color: #ffffff;
            --surface-hover: #f1f3f5;
            --text-color: #212529;
            --text-secondary: #6c757d;
            --border-color: #dee2e6;
            --accent-color: #0d6efd;
            --event-color: #e67e22;
            --danger-color: #dc3545;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.2s, color 0.2s;
        }

        .app-container {
            display: flex;
            width: 100%;
            height: 100%;
            max-width: 1440px;
            background-color: var(--bg-color);
            position: relative;
            overflow: hidden;
        }

        /* Sidebar / Management Panel (Desktop) */
        .sidebar {
            width: 400px;
            background-color: var(--surface-color);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 24px;
            gap: 20px;
            z-index: 10;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .brand {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand h2 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.4px;
            background: linear-gradient(135deg, var(--accent-color), var(--event-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .settings-bar {
            display: flex;
            gap: 8px;
        }

        .settings-btn {
            flex: 1;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .settings-btn:hover {
            border-color: var(--accent-color);
            background: var(--surface-hover);
        }

        .type-selector {
            display: flex;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 4px;
        }

        .type-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 8px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .type-btn.active {
            background: var(--surface-color);
            color: var(--text-color);
            box-shadow: var(--shadow);
        }

        .form-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: 12px;
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        input {
            width: 100%;
            padding: 10px 14px;
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        button.action-btn {
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: opacity 0.2s, transform 0.1s;
        }

        button.action-btn:active {
            transform: scale(0.98);
        }

        .items-list {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
        }

        .item-card {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 12px 14px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            transition: border-color 0.2s;
        }

        .item-card:hover {
            border-color: var(--text-secondary);
        }

        .item-card.completed span {
            text-decoration: line-through;
            color: var(--text-secondary);
        }

        .item-actions {
            display: flex;
            gap: 6px;
        }

        .item-actions button {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            font-size: 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .item-actions button:hover {
            color: var(--danger-color);
            border-color: var(--danger-color);
        }

        /* Main Content View */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 24px;
            overflow-y: auto;
            background-color: var(--bg-color);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .calendar-header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .calendar-nav {
            display: flex;
            gap: 6px;
        }

        .calendar-nav button {
            background-color: var(--surface-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: border-color 0.2s;
        }

        .calendar-nav button:hover {
            border-color: var(--accent-color);
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-auto-rows: minmax(110px, 1fr);
            gap: 8px;
            flex-grow: 1;
            padding-bottom: 20px;
        }

        .day-cell {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow-y: auto;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .day-cell.today {
            border-color: var(--accent-color);
            background-color: var(--surface-hover);
        }

        .day-number {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-secondary);
        }

        .day-cell.today .day-number {
            color: var(--accent-color);
        }

        .calendar-tag {
            background-color: var(--bg-color);
            padding: 4px 8px;
            font-size: 11px;
            border-radius: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            border: 1px solid var(--border-color);
            font-weight: 500;
        }

        .calendar-tag.task {
            border-left: 3px solid var(--accent-color);
        }

        .calendar-tag.event {
            border-left: 3px solid var(--event-color);
        }

        .calendar-tag.completed {
            opacity: 0.4;
            text-decoration: line-through;
            border-left-color: var(--text-secondary);
        }

        /* Mobile Bottom Navigation Bar (Hidden on Desktop) */
        .mobile-nav-bar {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--surface-color);
            border-top: 1px solid var(--border-color);
            padding: 10px 20px;
            justify-content: space-around;
            z-index: 100;
        }

        .mobile-nav-item {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .mobile-nav-item.active {
            color: var(--accent-color);
        }

        .mobile-view {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* Responsive Breakpoints for Mobile First Architecture */
        @media (max-width: 900px) {
            .app-container {
                flex-direction: column;
            }

            .sidebar {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: calc(100% - 65px);
                border-right: none;
                display: none;
                z-index: 50;
            }

            .sidebar.mobile-active {
                display: flex;
            }

            .main-content {
                height: calc(100% - 65px);
                padding: 16px;
                display: none;
            }

            .main-content.mobile-active {
                display: flex;
            }

            .mobile-nav-bar {
                display: flex;
            }

            .calendar-header h1 {
                font-size: 18px;
            }

            .days-grid {
                grid-auto-rows: minmax(75px, 1fr);
                gap: 6px;
            }

            .weekdays {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Sidebar / Task & Event Manager -->
        <div class="sidebar mobile-active" id="sidebarPanel">
            <div class="brand">
                <h2>Zalorforge-check</h2>
            </div>
            
            <div class="settings-bar">
                <button class="settings-btn" id="langBtn" onclick="toggleLanguage()">CZ / EN</button>
                <button class="settings-btn" id="themeBtn" onclick="toggleTheme()">Dark / Light</button>
            </div>

            <div class="type-selector">
                <button class="type-btn active" id="typeTaskBtn" onclick="switchInputType('task')">Task</button>
                <button class="type-btn" id="typeEventBtn" onclick="switchInputType('event')">Event</button>
            </div>

            <div class="form-panel">
                <div class="input-group">
                    <input type="text" id="itemTitle" placeholder="Title (e.g. Tomášek narozeniny)...">
                </div>
                <div class="input-group" id="timeGroup" style="display: none;">
                    <input type="time" id="itemTime">
                </div>
                <div class="input-group">
                    <input type="date" id="itemDate">
                    <button class="action-btn" id="addBtnText" onclick="addItem()">Add</button>
                </div>
            </div>

            <div class="items-list" id="itemsList"></div>
        </div>

        <!-- Main Calendar View -->
        <div class="main-content" id="calendarPanel">
            <div class="calendar-header">
                <h1 id="monthYearDisplay"></h1>
                <div class="header-controls">
                    <div class="calendar-nav">
                        <button onclick="changeMonth(-1)" id="prevBtnText">Prev</button>
                        <button onclick="currentMonthView()" id="todayBtnText">Today</button>
                        <button onclick="changeMonth(1)" id="nextBtnText">Next</button>
                    </div>
                </div>
            </div>

            <div class="weekdays" id="weekdaysGrid"></div>
            <div class="days-grid" id="daysGrid"></div>
        </div>

        <!-- Mobile Bottom Navigation Bar -->
        <div class="mobile-nav-bar">
            <button class="mobile-nav-item" id="navCalendarBtn" onclick="switchMobileTab('calendar')">
                <span style="font-size: 18px;">📅</span>
                <span id="navCalText">Calendar</span>
            </button>
            <button class="mobile-nav-item active" id="navTasksBtn" onclick="switchMobileTab('tasks')">
                <span style="font-size: 18px;">✔️</span>
                <span id="navTaskText">Tasks</span>
            </button>
        </div>
    </div>

    <script>
        const i18n = {
            cs: {
                task: "Úkol",
                event: "Událost",
                add: "Přidat",
                prev: "Zpět",
                today: "Dnes",
                next: "Další",
                done: "Hotovo",
                undo: "Zpět",
                del: "Smazat",
                titlePlaceholder: "Název (např. Tomášek narozeniny)...",
                alertTitle: "Zadejte prosím název.",
                navCalendar: "Kalendář",
                navTasks: "Úkoly",
                weekdays: ["Po", "Út", "St", "Čt", "Pá", "So", "Ne"],
                months: ["Leden", "Únor", "Březen", "Duben", "Květen", "Červen", "Červenec", "Srpen", "Září", "Říjen", "Listopad", "Prosinec"]
            },
            en: {
                task: "Task",
                event: "Event",
                add: "Add",
                prev: "Prev",
                today: "Today",
                next: "Next",
                done: "Done",
                undo: "Undo",
                del: "Del",
                titlePlaceholder: "Title (e.g. Tomášek birthday)...",
                alertTitle: "Please enter a title.",
                navCalendar: "Calendar",
                navTasks: "Tasks",
                weekdays: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"],
                months: ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"]
            }
        };

        let currentLang = localStorage.getItem('zalorforge_lang') || 'cs';
        let currentTheme = localStorage.getItem('zalorforge_theme') || 'dark';
        let items = JSON.parse(localStorage.getItem('zalorforge_items')) || [];
        let activeType = 'task';
        let today = new Date();
        let currentMonth = today.getMonth();
        let currentYear = today.getFullYear();

        document.documentElement.setAttribute('data-theme', currentTheme);

        function saveSettings() {
            localStorage.setItem('zalorforge_lang', currentLang);
            localStorage.setItem('zalorforge_theme', currentTheme);
            localStorage.setItem('zalorforge_items', JSON.stringify(items));
        }

        function toggleTheme() {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', currentTheme);
            saveSettings();
        }

        function toggleLanguage() {
            currentLang = currentLang === 'cs' ? 'en' : 'cs';
            saveSettings();
            render();
        }

        function switchMobileTab(tab) {
            const sidebar = document.getElementById('sidebarPanel');
            const calendar = document.getElementById('calendarPanel');
            const navTasks = document.getElementById('navTasksBtn');
            const navCalendar = document.getElementById('navCalendarBtn');

            if (tab === 'tasks') {
                sidebar.classList.add('mobile-active');
                calendar.classList.remove('mobile-active');
                navTasks.classList.add('active');
                navCalendar.classList.remove('active');
            } else {
                sidebar.classList.remove('mobile-active');
                calendar.classList.add('mobile-active');
                navCalendar.classList.add('active');
                navTasks.classList.remove('active');
            }
        }

        function switchInputType(type) {
            activeType = type;
            const taskBtn = document.getElementById('typeTaskBtn');
            const eventBtn = document.getElementById('typeEventBtn');
            const timeGroup = document.getElementById('timeGroup');
            const t = i18n[currentLang];

            taskBtn.textContent = t.task;
            eventBtn.textContent = t.event;

            if (type === 'task') {
                taskBtn.classList.add('active');
                eventBtn.classList.remove('active');
                timeGroup.style.display = 'none';
            } else {
                eventBtn.classList.add('active');
                taskBtn.classList.remove('active');
                timeGroup.style.display = 'flex';
            }
        }

        function addItem() {
            const titleInput = document.getElementById('itemTitle');
            const dateInput = document.getElementById('itemDate');
            const timeInput = document.getElementById('itemTime');
            const t = i18n[currentLang];
            
            if (!titleInput.value.trim()) return alert(t.alertTitle);

            const newItem = {
                id: Date.now(),
                type: activeType,
                title: titleInput.value.trim(),
                date: dateInput.value || new Date().toISOString().split('T')[0],
                time: activeType === 'event' ? (timeInput.value || '') : '',
                completed: false
            };

            items.push(newItem);
            saveSettings();
            
            titleInput.value = '';
            timeInput.value = '';
            dateInput.value = '';
            render();
        }

        function toggleComplete(id) {
            items = items.map(item => item.id === id ? { ...item, completed: !item.completed } : item);
            saveSettings();
            render();
        }

        function deleteItem(id) {
            items = items.filter(item => item.id !== id);
            saveSettings();
            render();
        }

        function changeMonth(direction) {
            currentMonth += direction;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            } else if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderCalendar();
        }

        function currentMonthView() {
            currentMonth = today.getMonth();
            currentYear = today.getFullYear();
            renderCalendar();
        }

        function render() {
            const t = i18n[currentLang];

            document.getElementById('typeTaskBtn').textContent = t.task;
            document.getElementById('typeEventBtn').textContent = t.event;
            document.getElementById('addBtnText').textContent = t.add;
            document.getElementById('prevBtnText').textContent = t.prev;
            document.getElementById('todayBtnText').textContent = t.today;
            document.getElementById('nextBtnText').textContent = t.next;
            document.getElementById('itemTitle').placeholder = t.titlePlaceholder;
            document.getElementById('navCalText').textContent = t.navCalendar;
            document.getElementById('navTaskText').textContent = t.navTasks;
            
            document.getElementById('weekdaysGrid').innerHTML = t.weekdays.map(d => `<div>${d}</div>`).join('');

            renderList();
            renderCalendar();
        }

        function renderList() {
            const listContainer = document.getElementById('itemsList');
            listContainer.innerHTML = '';
            const t = i18n[currentLang];

            const sortedItems = [...items].sort((a, b) => new Date(a.date) - new Date(b.date));

            sortedItems.forEach(item => {
                const div = document.createElement('div');
                div.className = `item-card ${item.completed ? 'completed' : ''}`;
                
                const badgeText = item.type === 'event' ? (item.time ? `${item.date} • ${item.time}` : item.date) : item.date;

                div.innerHTML = `
                    <div style="overflow: hidden; padding-right: 8px;">
                        <span style="display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500;">
                            ${item.type === 'event' ? '📅 ' : '✔️ '}${item.title}
                        </span>
                        <div style="font-size: 11px; color: var(--text-secondary); margin-top: 2px;">${badgeText}</div>
                    </div>
                    <div class="item-actions" style="flex-shrink: 0;">
                        ${item.type === 'task' ? `<button onclick="toggleComplete(${item.id})">${item.completed ? t.undo : t.done}</button>` : ''}
                        <button onclick="deleteItem(${item.id})">${t.del}</button>
                    </div>
                `;
                listContainer.appendChild(div);
            });
        }

        function renderCalendar() {
            const display = document.getElementById('monthYearDisplay');
            const grid = document.getElementById('daysGrid');
            const t = i18n[currentLang];
            
            display.textContent = `${t.months[currentMonth]} ${currentYear}`;
            grid.innerHTML = '';

            let firstDayIndex = (new Date(currentYear, currentMonth, 1).getDay() + 6) % 7;
            let totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell';
                cell.style.opacity = '0.15';
                grid.appendChild(cell);
            }

            for (let day = 1; day <= totalDays; day++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell';
                
                const formattedMonth = String(currentMonth + 1).padStart(2, '0');
                const formattedDay = String(day).padStart(2, '0');
                const dateString = `${currentYear}-${formattedMonth}-${formattedDay}`;

                if (day === today.getDate() && currentMonth === today.getMonth() && currentYear === today.getFullYear()) {
                    cell.classList.add('today');
                }

                cell.innerHTML = `<div class="day-number">${day}</div>`;

                const dayItems = items.filter(i => i.date === dateString);
                dayItems.forEach(item => {
                    const tag = document.createElement('div');
                    tag.className = `calendar-tag ${item.type} ${item.completed ? 'completed' : ''}`;
                    
                    const labelPrefix = item.type === 'event' && item.time ? `${item.time} ` : '';
                    tag.textContent = labelPrefix + item.title;
                    
                    tag.onclick = (e) => {
                        e.stopPropagation();
                        if (item.type === 'task') toggleComplete(item.id);
                    };
                    cell.appendChild(tag);
                });

                grid.appendChild(cell);
            }
        }

        render();
    </script>
</body>
</html>
