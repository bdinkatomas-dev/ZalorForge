<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zalorforge-check — Calendar & Tasks</title>
    <style>
        :root {
            --bg-color: #0f1117;
            --surface-color: #161b22;
            --surface-hover: #1f242c;
            --text-color: #f0f6fc;
            --text-secondary: #8b949e;
            --border-color: #30363d;
            --accent-color: #58a6ff;
            --success-color: #238636;
            --danger-color: #ff7b72;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        /* Sidebar / Task Management */
        .sidebar {
            width: 400px;
            background-color: var(--surface-color);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 24px;
            gap: 20px;
            z-index: 20;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .brand {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand h2 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .task-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: 10px;
        }

        .task-input-group {
            display: flex;
            gap: 8px;
        }

        input, select {
            flex-grow: 1;
            padding: 10px 12px;
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        button {
            background-color: var(--accent-color);
            color: #0d1117;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .task-list {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
        }

        .task-item {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            transition: border-color 0.2s;
        }

        .task-item:hover {
            border-color: var(--text-secondary);
        }

        .task-item.completed span {
            text-decoration: line-through;
            color: var(--text-secondary);
        }

        .task-actions {
            display: flex;
            gap: 6px;
        }

        .task-actions button {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 5px 10px;
            font-size: 11px;
        }

        .task-actions button:hover {
            color: var(--danger-color);
            border-color: var(--danger-color);
        }

        /* Main Calendar View */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 24px;
            overflow-y: auto;
            background-color: var(--bg-color);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .calendar-header h1 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .calendar-nav {
            display: flex;
            gap: 6px;
        }

        .calendar-nav button {
            background-color: var(--surface-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
        }

        .calendar-nav button:hover {
            border-color: var(--accent-color);
            opacity: 1;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-auto-rows: minmax(110px, 1fr);
            gap: 8px;
            flex-grow: 1;
        }

        .day-cell {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow-y: auto;
            transition: border-color 0.2s;
        }

        .day-cell.today {
            border-color: var(--accent-color);
            background-color: rgba(88, 166, 255, 0.03);
        }

        .day-number {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .day-cell.today .day-number {
            color: var(--accent-color);
        }

        .calendar-task-tag {
            background-color: var(--bg-color);
            border-left: 3px solid var(--accent-color);
            padding: 4px 8px;
            font-size: 11px;
            border-radius: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            border-top: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            transition: opacity 0.2s;
        }

        .calendar-task-tag:hover {
            border-color: var(--accent-color);
        }

        .calendar-task-tag.completed {
            opacity: 0.35;
            text-decoration: line-through;
            border-left-color: var(--text-secondary);
        }

        /* Mobile Controls */
        .mobile-only {
            display: none;
        }

        @media (max-width: 900px) {
            .sidebar {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                transform: translateX(-100%);
                border-right: none;
            }

            .sidebar.mobile-open {
                transform: translateX(0);
            }

            .mobile-only {
                display: inline-block;
            }

            .main-content {
                padding: 16px;
            }

            .calendar-header h1 {
                font-size: 18px;
            }

            .days-grid {
                grid-auto-rows: minmax(75px, 1fr);
                gap: 6px;
            }

            .weekdays {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Sidebar for Tasks -->
        <div class="sidebar" id="sidebar">
            <div class="brand">
                <h2>Zalorforge-check</h2>
                <button class="mobile-only" onclick="toggleMobileSidebar()" style="background:transparent; color:var(--text-color); border:1px solid var(--border-color); padding:4px 10px;">✕</button>
            </div>
            
            <div class="task-form">
                <div class="task-input-group">
                    <input type="text" id="taskTitle" placeholder="Task title...">
                </div>
                <div class="task-input-group">
                    <input type="date" id="taskDate">
                    <button onclick="addTask()">Add Task</button>
                </div>
            </div>

            <div class="task-list" id="taskList"></div>
        </div>

        <!-- Main Calendar View -->
        <div class="main-content">
            <div class="calendar-header">
                <h1 id="monthYearDisplay"></h1>
                <div class="header-controls">
                    <button class="mobile-only" onclick="toggleMobileSidebar()" style="background-color: var(--surface-color); color: var(--text-color); border: 1px solid var(--border-color);">Tasks ☰</button>
                    <div class="calendar-nav">
                        <button onclick="changeMonth(-1)">Prev</button>
                        <button onclick="currentMonthView()">Today</button>
                        <button onclick="changeMonth(1)">Next</button>
                    </div>
                </div>
            </div>

            <div class="weekdays">
                <div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div>
            </div>

            <div class="days-grid" id="daysGrid"></div>
        </div>
    </div>

    <script>
        let tasks = JSON.parse(localStorage.getItem('zalorforge_tasks')) || [];
        let today = new Date();
        let currentMonth = today.getMonth();
        let currentYear = today.getFullYear();

        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

        function saveTasks() {
            localStorage.setItem('zalorforge_tasks', JSON.stringify(tasks));
        }

        function toggleMobileSidebar() {
            document.getElementById('sidebar').classList.toggle('mobile-open');
        }

        function addTask() {
            const titleInput = document.getElementById('taskTitle');
            const dateInput = document.getElementById('taskDate');
            
            if (!titleInput.value.trim()) return alert('Please enter a task name.');

            const newTask = {
                id: Date.now(),
                title: titleInput.value.trim(),
                date: dateInput.value || new Date().toISOString().split('T')[0],
                completed: false
            };

            tasks.push(newTask);
            saveTasks();
            
            titleInput.value = '';
            dateInput.value = '';
            render();
        }

        function toggleTask(id) {
            tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
            saveTasks();
            render();
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveTasks();
            render();
        }

        function changeMonth(direction) {
            currentMonth += direction;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            } else if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderCalendar();
        }

        function currentMonthView() {
            currentMonth = today.getMonth();
            currentYear = today.getFullYear();
            renderCalendar();
        }

        function render() {
            renderTasks();
            renderCalendar();
        }

        function renderTasks() {
            const taskList = document.getElementById('taskList');
            taskList.innerHTML = '';

            const sortedTasks = [...tasks].sort((a, b) => new Date(a.date) - new Date(b.date));

            sortedTasks.forEach(task => {
                const div = document.createElement('div');
                div.className = `task-item ${task.completed ? 'completed' : ''}`;
                div.innerHTML = `
                    <div style="overflow: hidden; padding-right: 8px;">
                        <span style="display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500;">${task.title}</span>
                        <div style="font-size: 11px; color: var(--text-secondary); margin-top: 2px;">${task.date}</div>
                    </div>
                    <div class="task-actions" style="flex-shrink: 0;">
                        <button onclick="toggleTask(${task.id})">${task.completed ? 'Undo' : 'Done'}</button>
                        <button onclick="deleteTask(${task.id})">Del</button>
                    </div>
                `;
                taskList.appendChild(div);
            });
        }

        function renderCalendar() {
            const display = document.getElementById('monthYearDisplay');
            const grid = document.getElementById('daysGrid');
            
            display.textContent = `${monthNames[currentMonth]} ${currentYear}`;
            grid.innerHTML = '';

            let firstDayIndex = (new Date(currentYear, currentMonth, 1).getDay() + 6) % 7;
            let totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell';
                cell.style.opacity = '0.15';
                grid.appendChild(cell);
            }

            for (let day = 1; day <= totalDays; day++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell';
                
                const formattedMonth = String(currentMonth + 1).padStart(2, '0');
                const formattedDay = String(day).padStart(2, '0');
                const dateString = `${currentYear}-${formattedMonth}-${formattedDay}`;

                if (day === today.getDate() && currentMonth === today.getMonth() && currentYear === today.getFullYear()) {
                    cell.classList.add('today');
                }

                cell.innerHTML = `<div class="day-number">${day}</div>`;

                const dayTasks = tasks.filter(t => t.date === dateString);
                dayTasks.forEach(t => {
                    const tag = document.createElement('div');
                    tag.className = `calendar-task-tag ${t.completed ? 'completed' : ''}`;
                    tag.textContent = t.title;
                    tag.onclick = (e) => {
                        e.stopPropagation();
                        toggleTask(t.id);
                    };
                    cell.appendChild(tag);
                });

                grid.appendChild(cell);
            }
        }

        render();
    </script>
</body>
</html>
