<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZalorForge Wrive — Textový editor</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --surface-color: #161b22;
            --surface-hover: #1f242c;
            --text-color: #f0f6fc;
            --text-secondary: #8b949e;
            --border-color: #30363d;
            --accent-color: #58a6ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 15px;
            font-weight: 600;
        }

        .doc-title-input {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-color);
            font-size: 15px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 4px;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }

        .doc-title-input:hover, .doc-title-input:focus {
            background: var(--bg-color);
            border-color: var(--border-color);
        }

        .save-status {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .toolbar {
            display: flex;
            gap: 6px;
            padding: 8px 24px;
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            align-items: center;
            flex-wrap: wrap;
        }

        .toolbar button {
            background: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .toolbar button:hover {
            background: var(--surface-hover);
            border-color: var(--accent-color);
        }

        .editor-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            padding: 30px;
            overflow-y: auto;
            background-color: var(--bg-color);
        }

        .editor-page {
            width: 100%;
            max-width: 800px;
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 50px;
            min-height: 100%;
            outline: none;
            color: var(--text-color);
            font-size: 15px;
            line-height: 1.7;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .editor-page h1 { font-size: 28px; margin-bottom: 16px; }
        .editor-page h2 { font-size: 22px; margin-bottom: 12px; }
        .editor-page p { margin-bottom: 12px; }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <span>Wrive</span>
            <span>/</span>
            <input type="text" id="docTitle" class="doc-title-input" value="Můj nový dokument">
        </div>
        <div id="saveStatus" class="save-status">Všechny změny jsou uloženy lokálně</div>
    </header>

    <div class="toolbar">
        <button onclick="format('bold')"><b>B</b></button>
        <button onclick="format('italic')"><i>I</i></button>
        <button onclick="format('underline')"><u>U</u></button>
        <span style="width: 1px; height: 20px; background: var(--border-color); margin: 0 4px;"></span>
        <button onclick="format('insertUnorderedList')">Seznam</button>
        <button onclick="format('formatBlock', '<h1>')">Nadpis 1</button>
        <button onclick="format('formatBlock', '<p>')">Odstavec</button>
        <span style="width: 1px; height: 20px; background: var(--border-color); margin: 0 4px;"></span>
        <button onclick="clearStorage()" style="color: #ff7b72; border-color: rgba(255,123,114,0.3);">Vymazat data</button>
    </div>

    <div class="editor-container">
        <div id="editor" class="editor-page" contenteditable="true" placeholder="Začněte psát text..."></div>
    </div>

    <script>
        const editor = document.getElementById('editor');
        const docTitle = document.getElementById('docTitle');
        const saveStatus = document.getElementById('saveStatus');

        // Klíče pro localStorage
        const STORAGE_CONTENT_KEY = 'zalorforge_wrive_content';
        const STORAGE_TITLE_KEY = 'zalorforge_wrive_title';

        // Načtení dat při startu
        window.addEventListener('DOMContentLoaded', () => {
            const savedContent = localStorage.getItem(STORAGE_CONTENT_KEY);
            const savedTitle = localStorage.getItem(STORAGE_TITLE_KEY);

            if (savedContent) editor.innerHTML = savedContent;
            if (savedTitle) docTitle.value = savedTitle;
        });

        // Funkce pro formátování textu (Word-like akce)
        function format(command, value = null) {
            document.execCommand(command, false, value);
            editor.focus();
            saveData();
        }

        // Automatické ukládání do localStorage při psaní
        let timeout;
        function saveData() {
            saveStatus.textContent = 'Ukládá se...';
            clearTimeout(timeout);
            
            timeout = setTimeout(() => {
                localStorage.setItem(STORAGE_CONTENT_KEY, editor.innerHTML);
                localStorage.setItem(STORAGE_TITLE_KEY, docTitle.value);
                saveStatus.textContent = 'Uloženo lokálně';
            }, 400);
        }

        editor.addEventListener('input', saveData);
        docTitle.addEventListener('input', saveData);

        // Volitelná funkce pro vymazání úložiště
        function clearStorage() {
            if (confirm('Opravdu chcete vymazat celý obsah dokumentu z lokálního úložiště?')) {
                localStorage.removeItem(STORAGE_CONTENT_KEY);
                localStorage.removeItem(STORAGE_TITLE_KEY);
                editor.innerHTML = '';
                docTitle.value = 'Můj nový dokument';
                saveStatus.textContent = 'Úložiště vyčištěno';
            }
        }
    </script>
</body>
</html>
