<!DOCTYPE html>
<html lang="cs" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zalorforge — Write</title>
    <style>
        :root[data-theme="dark"] {
            --bg-color: #0b0f19;
            --surface-color: #131b2e;
            --surface-hover: #1c2640;
            --text-color: #f3f6fc;
            --text-secondary: #8b9ab3;
            --border-color: #26334f;
            --accent-color: #3b82f6;
            --accent-gradient: linear-gradient(135deg, #3b82f6, #6366f1);
            --editor-bg: #131b2e;
            --paper-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
            --modal-bg: rgba(11, 15, 25, 0.8);
        }

        :root[data-theme="light"] {
            --bg-color: #f1f5f9;
            --surface-color: #ffffff;
            --surface-hover: #f8fafc;
            --text-color: #0f172a;
            --text-secondary: #64748b;
            --border-color: #cbd5e1;
            --accent-color: #2563eb;
            --accent-gradient: linear-gradient(135deg, #2563eb, #4f46e5);
            --editor-bg: #ffffff;
            --paper-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.08);
            --modal-bg: rgba(15, 23, 42, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Hlavní layout aplikace */
        .app-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            max-width: 1600px;
            margin: 0 auto;
            overflow: hidden;
        }

        /* Top ribbon (Word style header) */
        .ribbon {
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 10;
            flex-shrink: 0;
        }

        .ribbon-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-title h1 {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .doc-title-input {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-color);
            font-size: 15px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 6px;
            outline: none;
            width: 250px;
            transition: all 0.2s;
        }

        .doc-title-input:hover, .doc-title-input:focus {
            border-color: var(--border-color);
            background: var(--surface-hover);
        }

        .ribbon-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .icon-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            border-color: var(--accent-color);
            background: var(--surface-hover);
        }

        /* Toolbar / Nástrojová lišta editoru */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            padding-top: 4px;
            border-top: 1px solid var(--border-color);
        }

        .tool-group {
            display: flex;
            gap: 2px;
            align-items: center;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 2px;
        }

        .tool-btn {
            background: transparent;
            border: none;
            color: var(--text-color);
            width: 30px;
            height: 30px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            transition: background 0.15s;
        }

        .tool-btn:hover {
            background: var(--surface-hover);
            color: var(--accent-color);
        }

        .tool-btn.active {
            background: var(--accent-color);
            color: #ffffff;
        }

        .tool-select {
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 12px;
            font-weight: 600;
            padding: 0 6px;
            height: 30px;
            outline: none;
            cursor: pointer;
        }

        .tool-select option {
            background: var(--surface-color);
            color: var(--text-color);
        }

        /* Workspace / Pracovní plocha (stránka) */
        .workspace {
            flex-grow: 1;
            overflow-y: auto;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            background-color: var(--bg-color);
        }

        .page {
            background-color: var(--editor-bg);
            color: var(--text-color);
            width: 100%;
            max-width: 850px;
            min-height: 1056px; /* Poměr A4 */
            padding: 60px 70px;
            border-radius: 4px;
            box-shadow: var(--paper-shadow);
            border: 1px solid var(--border-color);
            outline: none;
            font-size: 15px;
            line-height: 1.6;
            word-break: break-word;
        }

        .page[contenteditable]:empty:before {
            content: attr(data-placeholder);
            color: var(--text-secondary);
            pointer-events: none;
            display: block;
        }

        /* Status bar / Spodní lišta */
        .status-bar {
            background-color: var(--surface-color);
            border-top: 1px solid var(--border-color);
            padding: 6px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .stats-group {
            display: flex;
            gap: 16px;
        }

        /* Toast oznámení */
        .toast {
            position: fixed;
            bottom: 45px;
            left: 50%;
            transform: translateX(-50%) translateY(50px);
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            box-shadow: var(--paper-shadow);
            z-index: 2000;
            opacity: 0;
            transition: transform 0.2s ease, opacity 0.2s ease;
            pointer-events: none;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Responzivita pro mobily */
        @media (max-width: 768px) {
            .ribbon {
                padding: 10px 12px;
            }
            .doc-title-input {
                width: 150px;
            }
            .workspace {
                padding: 10px 6px;
            }
            .page {
                padding: 24px 18px;
                min-height: 100vh;
                border-radius: 0;
                border: none;
            }
            .toolbar {
                overflow-x: auto;
                flex-wrap: nowrap;
                padding-bottom: 6px;
            }
            .toolbar::-webkit-scrollbar {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Horní panel (Ribbon) -->
        <header class="ribbon">
            <div class="ribbon-top">
                <div class="brand-title">
                    <h1>Zalorforge Write</h1>
                    <input type="text" class="doc-title-input" id="docTitle" value="Bez názvu dokumentu">
                </div>
                <div class="ribbon-controls">
                    <button class="icon-btn" onclick="toggleLanguage()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                        <span id="langBtnText">CZ / EN</span>
                    </button>
                    <button class="icon-btn" onclick="toggleTheme()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                        <span id="themeBtnText">Theme</span>
                    </button>
                </div>
            </div>

            <!-- Nástrojová lišta (Toolbar) -->
            <div class="toolbar">
                <div class="tool-group">
                    <select class="tool-select" id="fontFamilySelect" onchange="formatDoc('fontName', this.value)">
                        <option value="Arial">Arial</option>
                        <option value="Georgia">Georgia</option>
                        <option value="Courier New">Courier New</option>
                        <option value="Times New Roman">Times New Roman</option>
                        <option value="Verdana">Verdana</option>
                    </select>
                    <select class="tool-select" id="fontSizeSelect" onchange="formatDoc('fontSize', this.value)">
                        <option value="3">12px</option>
                        <option value="4" selected>14px</option>
                        <option value="5">18px</option>
                        <option value="6">24px</option>
                        <option value="7">32px</option>
                    </select>
                </div>

                <div class="tool-group">
                    <button class="tool-btn" onclick="formatDoc('bold')" title="Tučné"><b>B</b></button>
                    <button class="tool-btn" onclick="formatDoc('italic')" title="Kurzíva"><i>I</i></button>
                    <button class="tool-btn" onclick="formatDoc('underline')" title="Podtržené"><u>U</u></button>
                    <button class="tool-btn" onclick="formatDoc('strikeThrough')" title="Přeškrtnuté"><s>S</s></button>
                </div>

                <div class="tool-group">
                    <button class="tool-btn" onclick="formatDoc('justifyLeft')" title="Zarovnat vlevo">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="17" y1="10" x2="3" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="17" y1="18" x2="3" y2="18"/></svg>
                    </button>
                    <button class="tool-btn" onclick="formatDoc('justifyCenter')" title="Zarovnat na střed">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="21" y1="6" x2="3" y2="6"/><line x1="19" y1="10" x2="5" y2="10"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="19" y1="18" x2="5" y2="18"/></svg>
                    </button>
                    <button class="tool-btn" onclick="formatDoc('justifyRight')" title="Zarovnat vpravo">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="21" y1="10" x2="7" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="21" y1="18" x2="7" y2="18"/></svg>
                    </button>
                </div>

                <div class="tool-group">
                    <button class="tool-btn" onclick="formatDoc('insertUnorderedList')" title="Odrážkový seznam">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                    </button>
                    <button class="tool-btn" onclick="formatDoc('insertOrderedList')" title="Číslovaný seznam">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="10" y1="6" x2="21" y2="6"/><line x1="10" y1="12" x2="21" y2="12"/><line x1="10" y1="18" x2="21" y2="18"/><path d="M4 6h1v4"/><path d="M4 10h2"/><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"/></svg>
                    </button>
                </div>

                <div class="tool-group">
                    <button class="icon-btn" onclick="insertLink()" style="border:none; background:transparent; padding: 4px 8px;" id="btnLink">Odkaz</button>
                    <button class="icon-btn" onclick="clearFormatting()" style="border:none; background:transparent; padding: 4px 8px;" id="btnClear">Vymazat formát</button>
                </div>
            </div>
        </header>

        <!-- Pracovní plocha (Editor / Papír) -->
        <main class="workspace">
            <div class="page" id="editor" contenteditable="true" data-placeholder="Zaněte psát svůj dokument..." oninput="updateStats()"></div>
        </main>

        <!-- Spodní stavová lišta -->
        <footer class="status-bar">
            <div class="stats-group">
                <span id="wordCountLabel">Slova: 0</span>
                <span id="charCountLabel">Znaky: 0</span>
            </div>
            <div>Zalorforge Write Engine v1.0</div>
        </footer>
    </div>

    <!-- Toast oznámení -->
    <div class="toast" id="toastMessage"></div>

    <script>
        const i18n = {
            cs: {
                placeholder: "Začněte psát svůj dokument...",
                untitled: "Bez názvu dokumentu",
                words: "Slova",
                chars: "Znaky",
                linkPrompt: "Zadejte URL adresu odkazu:",
                toastSaved: "Uloženo lokálně",
                theme: "Motiv"
            },
            en: {
                placeholder: "Start typing your document...",
                untitled: "Untitled Document",
                words: "Words",
                chars: "Characters",
                linkPrompt: "Enter the link URL:",
                toastSaved: "Saved locally",
                theme: "Theme"
            }
        };

        let currentLang = localStorage.getItem('zalorforge_write_lang') || 'cs';
        let currentTheme = localStorage.getItem('zalorforge_write_theme') || 'dark';

        document.documentElement.setAttribute('data-theme', currentTheme);

        function initEditor() {
            const editor = document.getElementById('editor');
            const titleInput = document.getElementById('docTitle');
            
            // Načtení uloženého obsahu z localStorage
            const savedContent = localStorage.getItem('zalorforge_write_content');
            const savedTitle = localStorage.getItem('zalorforge_write_title');

            if (savedContent) editor.innerHTML = savedContent;
            if (savedTitle) titleInput.value = savedTitle;

            updateStats();
            renderUI();
        }

        function formatDoc(cmd, value = null) {
            document.execCommand(cmd, false, value);
            document.getElementById('editor').focus();
        }

        function insertLink() {
            const t = i18n[currentLang];
            const url = prompt(t.linkPrompt, "https://");
            if (url) {
                formatDoc('createLink', url);
            }
        }

        function clearFormatting() {
            formatDoc('removeFormat');
        }

        function updateStats() {
            const editor = document.getElementById('editor');
            const text = editor.innerText || "";
            
            const words = text.trim() === "" ? 0 : text.trim().split(/\s+/).length;
            const chars = text.length;

            const t = i18n[currentLang];
            document.getElementById('wordCountLabel').textContent = `${t.words}: ${words}`;
            document.getElementById('charCountLabel').textContent = `${t.chars}: ${chars}`;

            // Auto-save do localStorage
            localStorage.setItem('zalorforge_write_content', editor.innerHTML);
            localStorage.setItem('zalorforge_write_title', document.getElementById('docTitle').value);
        }

        document.getElementById('docTitle').addEventListener('input', () => {
            localStorage.setItem('zalorforge_write_title', document.getElementById('docTitle').value);
        });

        function toggleTheme() {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', currentTheme);
            localStorage.setItem('zalorforge_write_theme', currentTheme);
        }

        function toggleLanguage() {
            currentLang = currentLang === 'cs' ? 'en' : 'cs';
            localStorage.setItem('zalorforge_write_lang', currentLang);
            renderUI();
            updateStats();
        }

        function renderUI() {
            const t = i18n[currentLang];
            document.getElementById('langBtnText').textContent = currentLang.toUpperCase();
            document.getElementById('editor').setAttribute('data-placeholder', t.placeholder);
            document.getElementById('btnLink').textContent = currentLang === 'cs' ? 'Odkaz' : 'Link';
            document.getElementById('btnClear').textContent = currentLang === 'cs' ? 'Vymazat formát' : 'Clear format';
        }

        function showToast(message) {
            const toast = document.getElementById('toastMessage');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 2000);
        }

        // Spuštění při načtení
        window.onload = () => {
            initEditor();
        };
    </script>
</body>
</html>
